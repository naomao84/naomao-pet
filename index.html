        rUpQ.push([hipRx, 0, 0]);
        lKneeQ.push([knee, 0, 0]);
        rKneeQ.push([knee, 0, 0]);
        lFootQ.push([footRx, 0, 0]);
        rFootQ.push([footRx, 0, 0]);
        tail1Q.push([0.14, Math.sin(ph * 2) * 0.34, 0]);
      }

      tracks.push(makePosTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]], false));
      tracks.push(makeQuatTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]]));
      if (b.hips) {
        tracks.push(makePosTrack(b.hips, times, hipPos));
        tracks.push(makeQuatTrack(b.hips, [0, dur], [[0, 0, 0], [0, 0, 0]]));
      }
      if (b.spine) tracks.push(makeQuatTrack(b.spine, times, spineQ));
      if (b.chest) tracks.push(makeScaleTrack(b.chest, times, chestScale));
      if (b.head) tracks.push(makeQuatTrack(b.head, times, headQ));
      if (b.leftArm) tracks.push(makeQuatTrack(b.leftArm, times, lArmQ));
      if (b.rightArm) tracks.push(makeQuatTrack(b.rightArm, times, rArmQ));
      if (b.leftForeArm) tracks.push(makeQuatTrack(b.leftForeArm, times, lForeQ));
      if (b.rightForeArm) tracks.push(makeQuatTrack(b.rightForeArm, times, rForeQ));
      if (b.leftUpLeg) tracks.push(makeQuatTrack(b.leftUpLeg, times, lUpQ));
      if (b.rightUpLeg) tracks.push(makeQuatTrack(b.rightUpLeg, times, rUpQ));
      if (b.leftLeg) tracks.push(makeQuatTrack(b.leftLeg, times, lKneeQ));
      if (b.rightLeg) tracks.push(makeQuatTrack(b.rightLeg, times, rKneeQ));
      if (b.leftFoot) tracks.push(makeQuatTrack(b.leftFoot, times, lFootQ));
      if (b.rightFoot) tracks.push(makeQuatTrack(b.rightFoot, times, rFootQ));
      if (b.tailBase) tracks.push(makeQuatTrack(b.tailBase, times, tail1Q));

      return new THREE.AnimationClip('Snack', dur, tracks);

    function bindAnimations(embeddedClips = []) {
      if (mixer) mixer.stopAllAction();
      Object.keys(actions).forEach((k) => delete actions[k]);
      currentAction = null;

      mixer = new THREE.AnimationMixer(characterPivot);

      const keywordMatchers = {
        Idle: ['idle', 'stand', 'breath', 'wait', 'rest'],
        Walk: ['walk', 'stroll', 'step', 'locomotion'],
        Run: ['run', 'sprint', 'trot', 'jog', 'dash'],
        Jump: ['jump', 'hop', 'leap', 'cheer', 'celebrat'],
        Wave: ['wave', 'greet', 'hello', 'hi'],
        Talk: ['talk', 'chat', 'speak', 'say', 'explain'],
        HappySpin: ['spin', 'twirl', 'pirouette'],
        Dance: ['dance', 'groove', 'boogie'],
        Stretch: ['stretch', 'yawn'],
        Curious: ['curious', 'tilt', 'inspect', 'look'],
        Sit: ['sit', 'seat', 'lounge'],
        Poke: ['poke', 'boop', 'hit', 'react'],
        Pet: ['pet', 'stroke', 'pat', 'purr'],
        DropLand: ['land', 'drop', 'impact'],
        Sleepy: ['sleep', 'drowsy', 'doze', 'nap'],
        Shy: ['shy', 'bashful', 'blush', 'timid'],
        Pout: ['pout', 'grumpy', 'sulky', 'angry', 'stomp'],
        Love: ['love', 'heart', 'adore', 'affection'],
        Sad: ['sad', 'cry', 'gloom', 'sniffle'],
        Proud: ['proud', 'confident', 'hero', 'victory'],
        Snack: ['snack', 'eat', 'munch', 'feed', 'treat']
      };

      const usedClips = new Set();
      for (const targetName of CANONICAL_ACTIONS) {
        const keywords = keywordMatchers[targetName] || [targetName.toLowerCase()];
        const found = embeddedClips.find((clip) => {
          if (usedClips.has(clip)) return false;
          const lower = (clip.name || '').toLowerCase();
          return keywords.some((kw) => lower.includes(kw));
        });
        if (found) {
          usedClips.add(found);
          actions[targetName] = mixer.clipAction(found);
        }
      }

      if (embeddedClips.length === 1 && usedClips.size === 0) {
        actions.Idle = mixer.clipAction(embeddedClips[0]);
      }

      for (const targetName of CANONICAL_ACTIONS) {
        if (!actions[targetName]) {
          actions[targetName] = mixer.clipAction(synthesizeActionClip(targetName));
        }
      }

      for (const name of CANONICAL_ACTIONS) {
        if (LOOPING_ACTIONS.has(name)) {
          actions[name].setLoop(THREE.LoopRepeat, Infinity);
          actions[name].clampWhenFinished = false;
        } else {
          const clipDur = actions[name].getClip().duration || 1.2;
          actions[name].setLoop(THREE.LoopOnce, clipDur < 0.55 ? 2 : 1);
          actions[name].clampWhenFinished = true;
        }
      }

      mixer.addEventListener('finished', (e) => {
        const finishedName = CANONICAL_ACTIONS.find((n) => actions[n] === e.action);
        if (finishedName && !LOOPING_ACTIONS.has(finishedName)) {
          if (facialRig.speechRemainingSec > 0.45) {
            playAnimation('Talk', { fadeDuration: 0.28, durationMs: Math.round(facialRig.speechRemainingSec * 1000) });
          } else if (petState.active) {
            playAnimation('Pet', { fadeDuration: 0.24 });
          } else {
            playAnimation('Idle', { fadeDuration: 0.30 });
          }
        }
      });

      currentAction = actions.Idle;
      currentActionName = 'Idle';
      currentAction.reset().setEffectiveWeight(1).play();
    }

    // =========================================================================
    // 12. Model Mounting & GLB Loader (Loads ppong.glb or Seamless Game Rig)
    // =========================================================================
    let isBuiltInRig = false;
    const GROUNDED_STANCE_ACTIONS = new Set([
      'Idle', 'Walk', 'Wave', 'Talk', 'Dance', 'Curious', 'Pet', 'DropLand',
      'Sleepy', 'Shy', 'Pout', 'Love', 'Sad', 'Proud', 'Snack'
    ]);

    function mountModel(rawModel, embeddedAnimations = [], isProcedural = false) {
      isBuiltInRig = !!isProcedural;
      while (characterPivot.children.length > 0) {
        characterPivot.remove(characterPivot.children[0]);
      }

      if (!isProcedural) {
        rawModel.traverse((child) => {
          if (child.isMesh || child.isSkinnedMesh) {
            if (child.isSkinnedMesh) child.frustumCulled = false;
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((m) => {
              if (!m) return;
              if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
              m.needsUpdate = true;
            });
          }
        });

        rawModel.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(rawModel);
        const size = new THREE.Vector3();
        box.getSize(size);

        if (size.y > 0.0001) {
          const targetHeight = 2.15;
          rawModel.scale.multiplyScalar(targetHeight / size.y);
          rawModel.updateMatrixWorld(true);

          const scaledBox = new THREE.Box3().setFromObject(rawModel);
          const scaledCenter = new THREE.Vector3();
          scaledBox.getCenter(scaledCenter);

          rawModel.position.x -= scaledCenter.x;
          rawModel.position.z -= scaledCenter.z;
          rawModel.position.y -= scaledBox.min.y;
        }
      }

      characterPivot.position.set(0, 0, 0);
      characterPivot.rotation.set(0, 0, 0);
      characterPivot.scale.set(1, 1, 1);
      characterPivot.add(rawModel);
      characterPivot.updateMatrixWorld(true);

      snapshotRestTransforms(characterPivot);
      discoverRigBones(rawModel);
      bindAnimations(embeddedAnimations);
    }

    async function loadPpongModel() {
      const gltfLoader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
      gltfLoader.setDRACOLoader(dracoLoader);

      const candidateUrls = ['./ppong.glb', './assets/ppong.glb', './models/ppong.glb'];

      for (const url of candidateUrls) {
        try {
          const gltf = await new Promise((resolve, reject) => {
            gltfLoader.load(url, resolve, undefined, reject);
          });
          mountModel(gltf.scene, gltf.animations || [], false);
          console.info(`[Ppong3D] Loaded external GLB from ${url} (${(gltf.animations || []).length} clips).`);
          return;
        } catch (_err) {
          // Try next candidate path
        }
      }

      const proceduralCharacter = buildProceduralPpong();
      mountModel(proceduralCharacter, [], true);
      console.info('[Ppong3D] Mounted Seamless 25-Bone Skinned Game Character Rig.');
    }

    // =========================================================================
    // 13. Public JS Bridge API (Invoked from PyQt6 via page().runJavaScript)
    // =========================================================================
    function normalizeActionName(rawName) {
      if (!rawName || typeof rawName !== 'string') return 'Idle';
      const cleaned = rawName.trim().toLowerCase().replace(/[\s_-]+/g, '');
      for (const canonical of CANONICAL_ACTIONS) {
        if (canonical.toLowerCase() === cleaned) return canonical;
      }
      if (cleaned.includes('spin') || cleaned.includes('twirl')) return 'HappySpin';
      if (cleaned.includes('dance') || cleaned.includes('groove')) return 'Dance';
      if (cleaned.includes('stretch') || cleaned.includes('yawn')) return 'Stretch';
      if (cleaned.includes('curious') || cleaned.includes('tilt') || cleaned.includes('inspect')) return 'Curious';
      if (cleaned.includes('sit') || cleaned.includes('rest')) return 'Sit';
      if (cleaned.includes('poke') || cleaned.includes('boop')) return 'Poke';
      if (cleaned.includes('pet') || cleaned.includes('stroke') || cleaned.includes('pat')) return 'Pet';
      if (cleaned.includes('land') || cleaned.includes('drop')) return 'DropLand';
      if (cleaned.includes('sleep') || cleaned.includes('drowsy') || cleaned.includes('doze') || cleaned.includes('nap')) return 'Sleepy';
      if (cleaned.includes('shy') || cleaned.includes('bashful') || cleaned.includes('blush')) return 'Shy';
      if (cleaned.includes('pout') || cleaned.includes('grumpy') || cleaned.includes('stomp') || cleaned.includes('sulky')) return 'Pout';
      if (cleaned.includes('love') || cleaned.includes('heart') || cleaned.includes('adore')) return 'Love';
      if (cleaned.includes('sad') || cleaned.includes('cry') || cleaned.includes('sniffle')) return 'Sad';
      if (cleaned.includes('proud') || cleaned.includes('confident') || cleaned.includes('victory')) return 'Proud';
      if (cleaned.includes('snack') || cleaned.includes('eat') || cleaned.includes('munch') || cleaned.includes('feed')) return 'Snack';
      if (cleaned.includes('run') || cleaned.includes('trot') || cleaned.includes('dash') || cleaned.includes('sprint')) return 'Run';
      if (cleaned.includes('wave') || cleaned.includes('greet') || cleaned.includes('hello')) return 'Wave';
      if (cleaned.includes('jump') || cleaned.includes('cheer') || cleaned.includes('happy')) return 'Jump';
      if (cleaned.includes('walk') || cleaned.includes('move') || cleaned.includes('stroll')) return 'Walk';
      if (cleaned.includes('talk') || cleaned.includes('speak') || cleaned.includes('chat')) return 'Talk';
      return 'Idle';
    }

    function setExpression(exprName, durationMs = 0) {
      facialRig.expressionOverride = exprName ? String(exprName).toLowerCase() : null;
      facialRig.expressionTimer = durationMs > 0 ? durationMs / 1000 : 0;
      if (exprName) {
        spawnEmotionEmotes(exprName);
      }
    }

    function setSpeechDuration(durationMs = 0) {
      facialRig.speechRemainingSec = Math.max(0, (Number(durationMs) || 0) / 1000);
    }

    function playAnimation(actionName, options = {}) {
      if (!mixer) return false;
      const targetName = normalizeActionName(actionName);
      const nextAction = actions[targetName];
      if (!nextAction) return false;

      const fadeDuration = typeof options.fadeDuration === 'number' ? options.fadeDuration : 0.24;

      if (actionRevertTimer) {
        clearTimeout(actionRevertTimer);
        actionRevertTimer = null;
      }

      if (typeof options.speechMs === 'number' && options.speechMs > 0) {
        facialRig.speechRemainingSec = options.speechMs / 1000;
      }

      // Secondary spring impulses & celebratory sparkles per game action
      if (targetName === 'Jump') {
        spawnSparkles(16, 1.55);
        springs.earLeftPitch.impulse(-3.0);
        springs.earRightPitch.impulse(-2.8);
        springs.tailPitch.impulse(4.0);
      } else if (targetName === 'HappySpin') {
        spawnSparkles(22, 1.48);
        springs.earLeftPitch.impulse(-2.6);
        springs.earRightPitch.impulse(-2.6);
        springs.tailYaw1.impulse(5.0);
      } else if (targetName === 'Wave') {
        spawnSparkles(10, 1.38);
        springs.earRightPitch.impulse(2.4);
      } else if (targetName === 'Dance') {
        spawnSparkles(14, 1.35);
        springs.tailYaw1.impulse(3.2);
      } else if (targetName === 'Poke') {
        spawnSparkles(12, 1.30);
        springs.landingSquash.impulse(-1.6);
        springs.earLeftPitch.impulse(3.4);
        springs.earRightPitch.impulse(3.2);
      } else if (targetName === 'DropLand') {
        spawnSparkles(10, 0.22);
        springs.landingSquash.impulse(-2.4);
        springs.earLeftPitch.impulse(3.6);
        springs.earRightPitch.impulse(3.4);
        springs.hornPitch.impulse(2.4);
      } else if (targetName === 'Curious') {
        springs.earLeftPitch.impulse(2.2);
      } else if (targetName === 'Stretch') {
        spawnSparkles(8, 1.45);
      }

      if (options.emotion) {
        setExpression(options.emotion, options.durationMs || options.speechMs || 3800);
      }

      if (nextAction === currentAction) {
        if (!LOOPING_ACTIONS.has(targetName)) {
          nextAction.reset().play();
        }
      } else {
        nextAction.enabled = true;
        nextAction.setEffectiveTimeScale(1.0);
        nextAction.setEffectiveWeight(1.0);
        nextAction.reset();
        nextAction.play();

        if (currentAction) {
          currentAction.crossFadeTo(nextAction, fadeDuration, false);
        }
        currentAction = nextAction;
        currentActionName = targetName;
      }

      if (LOOPING_ACTIONS.has(targetName) && targetName !== 'Idle' && targetName !== 'Walk' && targetName !== 'Run') {
        const revertMs = Number(options.durationMs) || 0;
        if (revertMs > 0) {
          actionRevertTimer = setTimeout(() => {
            if (currentActionName === targetName) {
              playAnimation('Idle', { fadeDuration: 0.34 });
            }
          }, revertMs);
        }
      }

      return true;
    }

    function setFacingDirection(dir) {
      facingDirection = Math.max(-1, Math.min(1, Number(dir) || 0));
    }

    function setStageYawOverride(radOrNull) {
      stageYawOverride = (typeof radOrNull === 'number' && Number.isFinite(radOrNull)) ? radOrNull : null;
    }

    function updateCursorTarget(nx, ny) {
      cursorTarget.x = Math.max(-1, Math.min(1, Number(nx) || 0));
      cursorTarget.y = Math.max(-1, Math.min(1, Number(ny) || 0));
    }

    function setDragState(isDragging, vx = 0, vy = 0) {
      dragState.active = !!isDragging;
      dragState.vx = Math.max(-1.5, Math.min(1.5, Number(vx) || 0));
      dragState.vy = Math.max(-1.5, Math.min(1.5, Number(vy) || 0));
      if (dragState.active) {
        fallState.active = false;
      }
    }

    function setFallingState(isFalling, vy = 0) {
      fallState.active = !!isFalling;
      fallState.vy = Math.max(-2.5, Math.min(2.5, Number(vy) || 0));
    }

    function setPettingState(isPetting) {

    const clock = new THREE.Clock();
    const tmpQuat = new THREE.Quaternion();

    function updateFacialAndEyes(dt, elapsed) {
      if (!facialRig.eyeMats.length) return;

      if (facialRig.speechRemainingSec > 0) {
        facialRig.speechRemainingSec = Math.max(0, facialRig.speechRemainingSec - dt);
      }

      // 1. Autonomous Natural Smooth Blinking (zero rapid twitching/flicker)
      if (!qaManualMode) {
        if (facialRig.blinkPhase < 0) {
          facialRig.blinkTimer -= dt;
          if (facialRig.blinkTimer <= 0) {
            facialRig.blinkPhase = 0;
          }
        }

        if (facialRig.blinkPhase >= 0) {
          const blinkDur = 0.22;
          facialRig.blinkPhase += dt / blinkDur;
          if (facialRig.blinkPhase >= 1.0) {
            facialRig.blinkPhase = -1;
            facialRig.blinkValue = 0.0;
            facialRig.blinkTimer = 4.0 + Math.random() * 4.5;
          } else {
            const p = facialRig.blinkPhase;
            facialRig.blinkValue = p < 0.35
              ? smoothstep(0, 0.35, p)
              : 1.0 - smoothstep(0.35, 1.0, p);
          }
        } else {
          facialRig.blinkValue = 0.0;
        }
      }

      // 2. Eye-Lead Cursor Gaze + Micro-Saccades (with Intermittent Gaze Blending)
      if (!qaManualMode) {
        facialRig.saccadeTimer -= dt;
        if (facialRig.saccadeTimer <= 0) {
          facialRig.saccadeTimer = 1.3 + Math.random() * 2.1;
          facialRig.saccadeOffset.set(
            (Math.random() - 0.5) * 0.06,
            (Math.random() - 0.5) * 0.04
          );
        }
      }

      const eyeRate = 1.0 - Math.exp(-18.0 * dt);
      const effectiveEyeX = THREE.MathUtils.lerp(gazeState.wanderX, cursorTarget.x, gazeState.currentWeight);
      const effectiveEyeY = THREE.MathUtils.lerp(gazeState.wanderY, cursorTarget.y, gazeState.currentWeight);
      const targetEyeX = effectiveEyeX * 0.85 + facialRig.saccadeOffset.x;
      const targetEyeY = effectiveEyeY * 0.75 + facialRig.saccadeOffset.y;
      facialRig.pupilCurrent.x += (targetEyeX - facialRig.pupilCurrent.x) * eyeRate;
      facialRig.pupilCurrent.y += (targetEyeY - facialRig.pupilCurrent.y) * eyeRate;

      // 3. Action & Emotion Targets (Dynamic Mouth Range — NEVER Frozen Wide Open in Idle!)
      if (facialRig.expressionTimer > 0) {
        facialRig.expressionTimer -= dt;
        if (facialRig.expressionTimer <= 0) facialRig.expressionOverride = null;
      }

      const isSpeakingNow = (currentActionName === 'Talk') || (facialRig.speechRemainingSec > 0.02);
      const activeExpr = (dragState.active || fallState.active)
        ? 'surprised'
        : (petState.active ? 'pet' : (facialRig.expressionOverride || currentActionName.toLowerCase()));

      // Default Idle: cozy, gentle cat-smile (mouthOpen ~ 0.16..0.24, NOT 0.84 frozen jaw!)
      let targetSquint = 0.04;

      let targetMouthOpen = 0.18 + 0.04 * Math.sin(elapsed * 1.9);

      let targetRoundO = 0.0;
      let targetPupilScale = 1.0;
      let targetBlush = 0.68;

        targetLashTilt = -0.05;
        targetMouthOpen = 0.96;
        targetMouthWidth = 1.12;
        targetMouthSmile = 0.92;
        targetPupilScale = 1.08;
        targetBlush = 0.90;
      } else if (activeExpr === 'dance') {
        targetSquint = 0.56 + 0.12 * Math.sin(elapsed * 8.2);
        targetLashTilt = -0.04;
        targetMouthOpen = 0.78 + 0.14 * Math.sin(elapsed * 8.2);
        targetMouthWidth = 1.08;
        targetMouthSmile = 0.86;
        targetPupilScale = 1.06;
        targetBlush = 0.86;
      } else if (activeExpr === 'wave' || activeExpr === 'happy') {
        targetSquint = 0.48;
        targetLashTilt = -0.04;
        targetMouthOpen = 0.82;
        targetMouthWidth = 1.08;
        targetMouthSmile = 0.84;
        targetPupilScale = 1.05;
        targetBlush = 0.84;
      } else if (activeExpr === 'pet') {

        targetLashTilt = -0.06;
        targetMouthOpen = 0.24 + 0.06 * Math.sin(elapsed * 6.0);
        targetMouthWidth = 1.04;
        targetMouthSmile = 0.94;
        targetPupilScale = 1.10;
        targetBlush = 0.95;

        targetLashTilt = -0.04;
        targetMouthOpen = 0.62;
        targetMouthWidth = 0.82;
        targetMouthSmile = 0.45;
        targetRoundO = 0.45;
        targetBlush = 0.78;

        targetMouthOpen = isRun ? 0.58 : 0.32;
        targetMouthWidth = isRun ? 1.06 : 1.00;
        targetMouthSmile = isRun ? 0.80 : 0.72;
        targetBlush = isRun ? 0.82 : 0.72;
      } else if (activeExpr === 'poke' || activeExpr === 'surprised' || activeExpr === 'dropland') {
        targetSquint = 0.0;
        targetLashTilt = 0.09;
        targetMouthOpen = 0.66;
        targetMouthWidth = 0.64;

      } else if (activeExpr === 'pouty' || activeExpr === 'pout') {

        targetSquint = 0.12;
        targetLashTilt = 0.08;

        targetSquint = 0.82;
        targetLashTilt = -0.06;
        targetMouthOpen = 0.32 + 0.08 * Math.sin(elapsed * 4.2);
        targetMouthWidth = 1.06;
        targetMouthSmile = 0.95;
        targetRoundO = 0.0;
        targetPupilScale = 1.18; // Dilated love pupils!
        targetBlush = 0.96;
      } else if (activeExpr === 'sad') {
        // Emotion 9: Sad / Tearful (raised inner brow angle, trembling mouth, pale blush)
        targetSquint = 0.28;
        targetLashTilt = 0.12;
        targetMouthOpen = 0.18 + 0.06 * Math.abs(Math.sin(elapsed * 8.0)); // Tremble
        targetMouthWidth = 0.76;
        targetMouthSmile = -0.42;
        targetRoundO = 0.22;
        targetPupilScale = 1.08;
        targetBlush = 0.48;
      } else if (activeExpr === 'proud') {
        // Emotion 10: Proud / Confident (firm confident smile, bright eyes, heroic posture)
        targetSquint = 0.38;
        targetLashTilt = -0.03;
        targetMouthOpen = 0.36;
        targetMouthWidth = 1.08;
        targetMouthSmile = 0.88;
        targetRoundO = 0.0;
        targetPupilScale = 1.05;
        targetBlush = 0.76;
      } else if (activeExpr === 'snack') {
        targetSquint = 0.58;
        targetLashTilt = -0.04;
        targetMouthOpen = 0.42 + 0.35 * Math.sin(elapsed * 9.4);
        targetMouthWidth = 0.95;
        targetMouthSmile = 0.78;
        targetRoundO = 0.15;
        targetPupilScale = 1.06;
        targetBlush = 0.84;
        targetBlush = 0.74;
      } else if (activeExpr === 'sit') {
        targetSquint = 0.22;
        targetMouthOpen = 0.16;
        targetMouthWidth = 0.98;
        targetMouthSmile = 0.74;
        targetBlush = 0.74;
      }

      // Decoupled Live Syllable Lip-Sync Overlay: animates mouth across ALL actions while speaking!
      if (isSpeakingNow && !dragState.active && !fallState.active) {
        const syll = Math.abs(Math.sin(elapsed * 9.8)) * (0.60 + 0.40 * Math.sin(elapsed * 4.1 + 0.7));
        targetMouthOpen = 0.12 + 0.84 * syll;
        targetMouthWidth = 0.88 + 0.22 * Math.sin(elapsed * 5.6);
        targetMouthSmile = Math.max(targetMouthSmile * 0.8, 0.54 + 0.26 * syll);
        targetRoundO = Math.max(0, -Math.sin(elapsed * 5.6)) * 0.36;

      const exprRate = 1.0 - Math.exp(-12.0 * dt);
      const mouthRate = isSpeakingNow ? (1.0 - Math.exp(-25.0 * dt)) : exprRate;

      facialRig.happySquintCurrent += (targetSquint - facialRig.happySquintCurrent) * exprRate;
      facialRig.lashTiltCurrent += (targetLashTilt - facialRig.lashTiltCurrent) * exprRate;
      facialRig.mouthOpenCurrent += (targetMouthOpen - facialRig.mouthOpenCurrent) * mouthRate;
      facialRig.mouthWidthCurrent += (targetMouthWidth - facialRig.mouthWidthCurrent) * mouthRate;
      facialRig.mouthSmileCurrent += (targetMouthSmile - facialRig.mouthSmileCurrent) * exprRate;
      facialRig.mouthRoundOCurrent += (targetRoundO - facialRig.mouthRoundOCurrent) * exprRate;

      const effectiveBlink = Math.max(0, facialRig.blinkValue * (1.0 - facialRig.happySquintCurrent * 0.48));

      for (const m of facialRig.eyeMats) {
        m.uniforms.uPupilOffset.value.copy(facialRig.pupilCurrent);
        m.uniforms.uBlink.value = effectiveBlink;
        m.uniforms.uHappySquint.value = facialRig.happySquintCurrent;
        m.uniforms.uPupilScale.value += (targetPupilScale - m.uniforms.uPupilScale.value) * exprRate;
      }

      // Synchronize Upper Eyeliner + 4 Eyelashes cleanly with Alpha-Cutout Blink & Happy Squint!
      const lashDropY = -effectiveBlink * 0.075 + facialRig.happySquintCurrent * 0.012;
      const lashScaleY = 1.0 - effectiveBlink * 0.65;
      const lashPitch = effectiveBlink * 0.28;
      if (facialRig.leftLashPivot) {
        facialRig.leftLashPivot.position.y = facialRig.leftLashPivot.userData.baseY + lashDropY;
        facialRig.leftLashPivot.position.z = facialRig.leftLashPivot.userData.baseZ + effectiveBlink * 0.002;
        facialRig.leftLashPivot.scale.y = lashScaleY;
        facialRig.leftLashPivot.rotation.x = lashPitch;
        facialRig.leftLashPivot.rotation.z = -facialRig.lashTiltCurrent;
      }
      if (facialRig.rightLashPivot) {
        facialRig.rightLashPivot.position.y = facialRig.rightLashPivot.userData.baseY + lashDropY;
        facialRig.rightLashPivot.position.z = facialRig.rightLashPivot.userData.baseZ + effectiveBlink * 0.002;
        facialRig.rightLashPivot.scale.y = lashScaleY;
        facialRig.rightLashPivot.rotation.x = lashPitch;
        facialRig.rightLashPivot.rotation.z = facialRig.lashTiltCurrent;
      }

      // Synchronize Cat Mouth Interior Parallax, Pink Tongue Bounce & Cheek-Blush Lift
      if (facialRig.mouthMat) {
        facialRig.mouthMat.uniforms.uOpen.value = facialRig.mouthOpenCurrent;
        facialRig.mouthMat.uniforms.uWidth.value = facialRig.mouthWidthCurrent;
        facialRig.mouthMat.uniforms.uSmile.value = facialRig.mouthSmileCurrent;
        facialRig.mouthMat.uniforms.uRoundO.value = facialRig.mouthRoundOCurrent;
        facialRig.mouthMat.uniforms.uTongueBounce.value = isSpeakingNow
          ? 0.08 * Math.sin(elapsed * 14.0)
          : 0.0;
      }

      const smileLift = Math.max(0, (facialRig.mouthWidthCurrent - 0.94) * 0.045) +
        facialRig.happySquintCurrent * 0.012;
      if (facialRig.leftBlushMesh) {
        facialRig.leftBlushMesh.position.y = facialRig.leftBlushMesh.userData.baseY + smileLift;
      }
      if (facialRig.rightBlushMesh) {
        facialRig.rightBlushMesh.position.y = facialRig.rightBlushMesh.userData.baseY + smileLift;
      }
      for (const bm of facialRig.blushMats) {
        bm.uniforms.uIntensity.value += (targetBlush - bm.uniforms.uIntensity.value) * exprRate;
      }
    }

    function applyLayeredGazeAndSpringPhysics(dt, elapsed) {
      // Natural Intermittent Gaze Blending: smoothly wander when attentionWeight is low
      gazeState.currentWeight += (gazeState.attentionWeight - gazeState.currentWeight) * (1.0 - Math.exp(-4.5 * dt));
      if (!qaManualMode) {
        gazeState.wanderTimer -= dt;
        if (gazeState.wanderTimer <= 0) {
          gazeState.wanderTimer = 2.4 + Math.random() * 3.2;
          gazeState.wanderX = (Math.random() - 0.5) * 0.45;
          gazeState.wanderY = (Math.random() - 0.5) * 0.28;
        }
      }
      const effectiveTargetX = THREE.MathUtils.lerp(gazeState.wanderX, cursorTarget.x, gazeState.currentWeight);
      const effectiveTargetY = THREE.MathUtils.lerp(gazeState.wanderY, cursorTarget.y, gazeState.currentWeight);

      // 1. Multi-Stage Phase-Lagged Cursor Tracking + True 66.5/74.5-deg Side-Stride Locomotion Yaw!
      const headRate = 1.0 - Math.exp(-8.0 * dt);
      const bodyRate = 1.0 - Math.exp(-4.8 * dt);

      cursorHeadSmoothed.x += (effectiveTargetX - cursorHeadSmoothed.x) * headRate;
      cursorHeadSmoothed.y += (effectiveTargetY - cursorHeadSmoothed.y) * headRate;
      cursorBodySmoothed.x += (effectiveTargetX - cursorBodySmoothed.x) * bodyRate;
      cursorBodySmoothed.y += (effectiveTargetY - cursorBodySmoothed.y) * bodyRate;

      const isLocomoting = (currentActionName === 'Walk' || currentActionName === 'Run') && facingDirection !== 0;
      const locoYaw = currentActionName === 'Run'
        ? facingDirection * 1.30   // 74.5 deg energetic profile run
        : facingDirection * 1.16;  // 66.5 deg cute 3/4-profile waddle walk (eliminates crab-walk!)
      const subtleBodyTurn = facingDirection === 0 ? cursorBodySmoothed.x * 0.14 : 0;
      const desiredStageYaw = stageYawOverride !== null
        ? stageYawOverride
        : (facingDirection !== 0 ? locoYaw : subtleBodyTurn);

      prevFacingYaw = currentFacingYaw;
      currentFacingYaw += (desiredStageYaw - currentFacingYaw) * (1.0 - Math.exp(-9.5 * dt));
      stageGroup.rotation.y = currentFacingYaw;

      const yawVel = (currentFacingYaw - prevFacingYaw) / Math.max(0.001, dt);
      const curPivotY = characterPivot.position.y;
      const vertVel = (curPivotY - prevPivotY) / Math.max(0.001, dt);
      if (!qaManualMode && prevPivotY > 0.04 && curPivotY <= 0.01) {
        springs.landingSquash.impulse(-1.4);
        springs.earLeftPitch.impulse(2.4);
        springs.earRightPitch.impulse(2.2);
        springs.hornPitch.impulse(1.8);
      }
      prevPivotY = curPivotY;

      // Friendly head counter-glance toward user while walking so face remains appealing!
      const friendlyGlanceYaw = isLocomoting ? (-facingDirection * 0.28) : 0.0;
      const lookWeight = isLocomoting ? 0.35 : 1.0;
      const totalLookYaw = cursorHeadSmoothed.x * 0.44 * lookWeight + friendlyGlanceYaw;
      const totalLookPitch = -cursorHeadSmoothed.y * 0.25 * lookWeight;

      if (rigBones.spine) {
        addBoneEulerOffset(rigBones.spine, totalLookPitch * 0.10, cursorBodySmoothed.x * 0.08 * lookWeight, 0);
      }
      if (rigBones.chest) {
        addBoneEulerOffset(rigBones.chest, totalLookPitch * 0.15, cursorBodySmoothed.x * 0.12 * lookWeight, 0);
      }
      if (rigBones.neck) {
        addBoneEulerOffset(rigBones.neck, totalLookPitch * 0.28, totalLookYaw * 0.32, 0);
      }
      if (rigBones.head) {
        const curiousTilt = Math.sin(elapsed * 0.9) * 0.022 - cursorHeadSmoothed.x * 0.055 * lookWeight;
        addBoneEulerOffset(rigBones.head, totalLookPitch * 0.54, totalLookYaw * 0.56, curiousTilt);
      }

      // 2. Autonomous Micro-Fidgets in Idle + Foot/Pet Sparkles + 2nd-Order Spring Physics
      if (!qaManualMode) {
        microLife.earTwitchTimer -= dt;
        if (microLife.earTwitchTimer <= 0) {
          microLife.earTwitchTimer = 2.2 + Math.random() * 3.8;
          if (Math.random() < 0.5) springs.earLeftPitch.impulse(2.9);
          else springs.earRightPitch.impulse(2.9);
        }

        if (currentActionName === 'Idle' && !dragState.active && !fallState.active) {
          microLife.fidgetTimer -= dt;
          if (microLife.fidgetTimer <= 0 && microLife.fidgetPhase < 0) {
            microLife.fidgetType = Math.floor(Math.random() * 3);
            microLife.fidgetPhase = 0;
          }
          if (microLife.fidgetPhase >= 0) {
            microLife.fidgetPhase += dt / 1.15;
            if (microLife.fidgetPhase >= 1.0) {
              microLife.fidgetPhase = -1;
              microLife.fidgetTimer = 3.8 + Math.random() * 4.2;
            } else {
              const fEnv = Math.sin(microLife.fidgetPhase * Math.PI);
              if (microLife.fidgetType === 0 && rigBones.head) {
                // Cute curious micro head-tilt
                addBoneEulerOffset(rigBones.head, -0.04 * fEnv, 0.08 * fEnv, 0.15 * fEnv);
              } else if (microLife.fidgetType === 1 && rigBones.tailBase) {
                // Happy double cloud-tail swish
                const wag = Math.sin(microLife.fidgetPhase * Math.PI * 4) * fEnv;
                addBoneEulerOffset(rigBones.tailBase, 0.08 * fEnv, 0.28 * wag, 0);
              } else if (rigBones.chest) {
                // Little cheerful bounce-shrug
                springs.landingSquash.target = 0.06 * fEnv;
              }
            }
          }
        } else {
          microLife.fidgetPhase = -1;
        }

        if (currentActionName === 'Run') {
          microLife.runSparkleTimer -= dt;
          if (microLife.runSparkleTimer <= 0) {
            microLife.runSparkleTimer = 0.16;
            spawnSparkles(2, 0.16);
          }
        }
        if (petState.active) {
          microLife.petSparkleTimer -= dt;
          if (microLife.petSparkleTimer <= 0) {
            microLife.petSparkleTimer = 0.28;
            spawnSparkles(3, 1.56);
          }
        }
      }

      const airFallVy = fallState.active ? fallState.vy : 0;
      springs.earLeftPitch.target = -vertVel * 0.14 - (fallState.active ? 0.38 : 0);
      springs.earRightPitch.target = -vertVel * 0.14 - (fallState.active ? 0.38 : 0);
      springs.earRoll.target = -yawVel * 0.06 - dragState.vx * 0.25;
      springs.hornPitch.target = -vertVel * 0.05;
      springs.tailYaw1.target = -yawVel * 0.16 - dragState.vx * 0.35;
      springs.tailYaw2.target = springs.tailYaw1.pos * 1.15;
      springs.tailPitch.target = -vertVel * 0.22 + dragState.vy * 0.25 - airFallVy * 0.18;
      if (microLife.fidgetPhase < 0 || microLife.fidgetType !== 2) {
        springs.landingSquash.target = 0;
      }

      const earLP = springs.earLeftPitch.step(dt);
      const earRP = springs.earRightPitch.step(dt);
      const earR = springs.earRoll.step(dt);
      const hornP = springs.hornPitch.step(dt);
      const tYaw1 = springs.tailYaw1.step(dt);
      const tYaw2 = springs.tailYaw2.step(dt);
      const tPitch = springs.tailPitch.step(dt);
      const squashJiggle = springs.landingSquash.step(dt);

      if (rigBones.leftEar) addBoneEulerOffset(rigBones.leftEar, earLP, 0, earR + 0.04 * Math.sin(elapsed * 2.1));
      if (rigBones.rightEar) addBoneEulerOffset(rigBones.rightEar, earRP, 0, earR - 0.04 * Math.sin(elapsed * 2.1 + 0.6));
      if (rigBones.horn) addBoneEulerOffset(rigBones.horn, hornP, 0, earR * 0.25);

      if (rigBones.tailBase) addBoneEulerOffset(rigBones.tailBase, tPitch, tYaw1, 0);
      if (rigBones.tailMid) addBoneEulerOffset(rigBones.tailMid, tPitch * 0.8, tYaw2, 0);
      if (rigBones.tailTip) addBoneEulerOffset(rigBones.tailTip, tPitch * 0.6, tYaw2 * 0.8, 0);

      if (rigBones.spine && Math.abs(squashJiggle) > 0.0005) {
        const sy = 1.0 + squashJiggle * 0.18;
        const sxz = 1.0 - squashJiggle * 0.10;
        rigBones.spine.scale.multiply(new THREE.Vector3(sxz, sy, sxz));
      }

      // 3. Interactive Mouse-Drag Dangle & Free-Fall Parachute Pose
      const airBlendTarget = (dragState.active || fallState.active) ? 1.0 : 0.0;
      dragState.blend += (airBlendTarget - dragState.blend) * (1.0 - Math.exp(-14.0 * dt));

      if (dragState.blend > 0.005) {
        const b = dragState.blend;
        const freq = fallState.active ? 20.0 : 15.0;
        const kick = Math.sin(elapsed * freq) * 0.34 * b;
        const flutter = Math.sin(elapsed * 18.0) * 0.12 * b;
        stageGroup.rotation.z = THREE.MathUtils.lerp(stageGroup.rotation.z, -dragState.vx * 0.22, 0.25) * b;

        if (rigBones.leftUpLeg) addBoneEulerOffset(rigBones.leftUpLeg, kick - 0.12 * b, 0, -0.08 * b);
        if (rigBones.rightUpLeg) addBoneEulerOffset(rigBones.rightUpLeg, -kick - 0.12 * b, 0, 0.08 * b);
        if (rigBones.leftLeg) addBoneEulerOffset(rigBones.leftLeg, 0.32 * b + Math.max(0, kick) * 0.42, 0, 0);
        if (rigBones.rightLeg) addBoneEulerOffset(rigBones.rightLeg, 0.32 * b + Math.max(0, -kick) * 0.42, 0, 0);
        if (rigBones.leftFoot) addBoneEulerOffset(rigBones.leftFoot, 0.34 * b, 0, 0);
        if (rigBones.rightFoot) addBoneEulerOffset(rigBones.rightFoot, 0.34 * b, 0, 0);
        // Lift arms from -37 deg Idle A-stance up to +18 deg fluttering balance pose (clear of cheeks!)
        if (rigBones.leftArm) addBoneEulerOffset(rigBones.leftArm, 0, 0, (-0.88 + flutter) * b);
        if (rigBones.rightArm) addBoneEulerOffset(rigBones.rightArm, 0, 0, (0.88 - flutter) * b);
      } else {
        stageGroup.rotation.z *= 0.85;
        if (Math.abs(stageGroup.rotation.z) < 0.0005) stageGroup.rotation.z = 0;
      }

      // 3.5. Highly Active Special Action Bone Adjustments
      if (spiderSwingState.active) {
        const t = spiderSwingState.t;
        const dir = spiderSwingState.dir;
        const swingAngle = Math.sin(t * Math.PI) * 0.58 * dir;
        stageGroup.rotation.z = -swingAngle;

        if (t < 0.85) {
          if (rigBones.rightArm) addBoneEulerOffset(rigBones.rightArm, 0, 0, 2.3);
          if (rigBones.leftArm) addBoneEulerOffset(rigBones.leftArm, 0, 0, -1.2);
          if (rigBones.leftUpLeg) addBoneEulerOffset(rigBones.leftUpLeg, 0.85, 0, 0);
          if (rigBones.rightUpLeg) addBoneEulerOffset(rigBones.rightUpLeg, 0.70, 0, 0);
          if (rigBones.leftLeg) addBoneEulerOffset(rigBones.leftLeg, 0.65, 0, 0);
          if (rigBones.rightLeg) addBoneEulerOffset(rigBones.rightLeg, 0.65, 0, 0);
        } else {
          if (rigBones.rightArm) addBoneEulerOffset(rigBones.rightArm, -1.3, 0, 0);
          if (rigBones.leftArm) addBoneEulerOffset(rigBones.leftArm, 0.35, 0, -0.6);
        }
      }

      if (windowHeistState.active) {
        windowHeistGroup.visible = true;
        const wBob = Math.sin(elapsed * 14.0) * 0.04;
        windowHeistGroup.position.set(0, 1.44 + wBob, 0.12);
        windowHeistGroup.rotation.set(0.28, -stageGroup.rotation.y * 0.65, 0);
        if (rigBones.leftArm) addBoneEulerOffset(rigBones.leftArm, 0, 0, -2.4);
        if (rigBones.rightArm) addBoneEulerOffset(rigBones.rightArm, 0, 0, 2.4);
      } else {
        windowHeistGroup.visible = false;
      }

      if (peekState.active) {
        const d = peekState.depth;
        characterPivot.position.y = -0.42 * d;
        if (rigBones.leftArm) addBoneEulerOffset(rigBones.leftArm, -1.1 * d, 0, -0.15 * d);
        if (rigBones.rightArm) addBoneEulerOffset(rigBones.rightArm, -1.1 * d, 0, 0.15 * d);
        if (rigBones.head) {
          const scan = Math.sin(peekState.scanTime * 3.2) * 0.35;
          addBoneEulerOffset(rigBones.head, 0.15 * d, scan * d, 0.10 * d);
        }
      } else if (characterPivot.position.y < -0.001) {
        characterPivot.position.y = THREE.MathUtils.lerp(characterPivot.position.y, 0, 0.25);
      }

      if (magicDoodleState.active) {
        magicDoodleGroup.visible = true;
        buildDoodleShapeVertices(magicDoodleState.shape, magicDoodleState.progress);
        const sweep = Math.sin(magicDoodleState.progress * Math.PI * 4) * 0.45;
        if (rigBones.rightArm) addBoneEulerOffset(rigBones.rightArm, -0.85 + sweep, 0, 0.55 + sweep * 0.4);
        if (rigBones.head) addBoneEulerOffset(rigBones.head, -0.1, sweep * 0.25, 0.08);
      } else if (magicDoodleState.lingerTime > 0) {
        magicDoodleGroup.visible = true;
      } else {
        magicDoodleGroup.visible = false;
      }

      if (supermanFlyState.active) {
        // Natural aerodynamic forward flight angle in local character space, elevated so body stays centered in window
        characterPivot.rotation.x = THREE.MathUtils.lerp(characterPivot.rotation.x, 0.38, 0.18);
        stageGroup.position.y = THREE.MathUtils.lerp(stageGroup.position.y, 0.35, 0.18);
        stageGroup.rotation.x = 0;
        if (rigBones.leftArm) addBoneEulerOffset(rigBones.leftArm, 0, 0, -2.55);
        if (rigBones.rightArm) addBoneEulerOffset(rigBones.rightArm, 0, 0, 2.55);
        if (rigBones.leftUpLeg) addBoneEulerOffset(rigBones.leftUpLeg, -0.42, 0, 0);
        if (rigBones.rightUpLeg) addBoneEulerOffset(rigBones.rightUpLeg, -0.42, 0, 0);
      } else {
        characterPivot.rotation.x = THREE.MathUtils.lerp(characterPivot.rotation.x, 0, 0.28);
        if (Math.abs(characterPivot.rotation.x) < 0.005) characterPivot.rotation.x = 0;
        stageGroup.position.y = THREE.MathUtils.lerp(stageGroup.position.y, 0, 0.28);
        if (Math.abs(stageGroup.position.y) < 0.005) stageGroup.position.y = 0;
        stageGroup.rotation.x = 0;
      }

      // 4. Real-Time Post-Mixer Ground Contact Clamp (eliminates Catmull-Rom cusp & crossfade sole drift!)
      // Safely bypassed during flying, swinging, and special solo play activities to eliminate clipping
      if (
        isBuiltInRig &&
        dragState.blend <= 0.005 &&
        !fallState.active &&
        !supermanFlyState.active &&
        !spiderSwingState.active &&
        (!soloPlaySys || !soloPlaySys.isSoloPlayingActive()) &&
        rigBones.hips &&
        rigBones.leftFoot &&
        rigBones.rightFoot &&
        currentActionName !== 'Sit'
      ) {
        scene.updateMatrixWorld(true);
        tmpDiagA.set(0, -0.035, 0.015).applyMatrix4(rigBones.leftFoot.matrixWorld);
        tmpDiagB.set(0, -0.035, 0.015).applyMatrix4(rigBones.rightFoot.matrixWorld);
        const minSoleY = Math.min(tmpDiagA.y, tmpDiagB.y);
        // Safety clamp: never shift hips downwards by more than 0.04m, preventing any pose from pushing head/torso below window bottom
        const safeClampY = Math.max(-0.04, Math.min(0.04, minSoleY));
        if (GROUNDED_STANCE_ACTIONS.has(currentActionName)) {
          rigBones.hips.position.y -= safeClampY;
        } else if (minSoleY < 0) {
          rigBones.hips.position.y -= Math.max(-0.04, minSoleY);
        }
      }
    }

    function updateContactShadow() {
      characterPivot.updateMatrixWorld(true);

      if (rigBones.leftFoot && rigBones.rightFoot && rigBones.hips) {
        rigBones.leftFoot.getWorldPosition(tmpVecL);
        rigBones.rightFoot.getWorldPosition(tmpVecR);
        rigBones.hips.getWorldPosition(tmpVecH);

        contactShadowUniforms.uLeftFoot.value.set(tmpVecL.x, tmpVecL.z);
        contactShadowUniforms.uRightFoot.value.set(tmpVecR.x, tmpVecR.z);
        contactShadowUniforms.uBodyCenter.value.set(tmpVecH.x, tmpVecH.z);
        contactShadowUniforms.uLeftLift.value = Math.max(0, tmpVecL.y - 0.035);
        contactShadowUniforms.uRightLift.value = Math.max(0, tmpVecR.y - 0.035);
        contactShadowUniforms.uBodyLift.value = Math.max(0, characterPivot.position.y);
      } else {
        contactShadowUniforms.uBodyLift.value = Math.max(0, characterPivot.position.y);
      }
    }

    // Ground-Truth 3D Motion & Geometry QA Diagnostics (invoked by automated Motion QA verifier)
    function getMotionDiagnostics() {
      scene.updateMatrixWorld(true);
      const b = rigBones;

      const worldOf = (node) => {
        if (!node) return [0, 0, 0];
        node.getWorldPosition(tmpDiagA);
        return [Number(tmpDiagA.x.toFixed(4)), Number(tmpDiagA.y.toFixed(4)), Number(tmpDiagA.z.toFixed(4))];
      };

      const hipsW = worldOf(b.hips);
      const headW = worldOf(b.head);
      const lArmW = worldOf(b.leftArm);
      const rArmW = worldOf(b.rightArm);
      const lHandW = worldOf(b.leftHand);
      const rHandW = worldOf(b.rightHand);
      const lUpLegW = worldOf(b.leftUpLeg);
      const rUpLegW = worldOf(b.rightUpLeg);
      const lLegW = worldOf(b.leftLeg);
      const rLegW = worldOf(b.rightLeg);
      const lFootW = worldOf(b.leftFoot);
      const rFootW = worldOf(b.rightFoot);

      const horizDistL = Math.hypot(lHandW[0] - lArmW[0], lHandW[2] - lArmW[2]) || 1e-5;
      const horizDistR = Math.hypot(rHandW[0] - rArmW[0], rHandW[2] - rArmW[2]) || 1e-5;
      const leftArmElevationDeg = THREE.MathUtils.radToDeg(Math.atan2(lHandW[1] - lArmW[1], horizDistL));
      const rightArmElevationDeg = THREE.MathUtils.radToDeg(Math.atan2(rHandW[1] - rArmW[1], horizDistR));

      // Sole world Y (foot bone local (0, -0.035, 0.02))
      let leftSoleY = lFootW[1] - 0.035;
      let rightSoleY = rFootW[1] - 0.035;
      if (b.leftFoot && b.rightFoot) {
        tmpDiagA.set(0, -0.035, 0.015).applyMatrix4(b.leftFoot.matrixWorld);
        leftSoleY = tmpDiagA.y;
        tmpDiagB.set(0, -0.035, 0.015).applyMatrix4(b.rightFoot.matrixWorld);
        rightSoleY = tmpDiagB.y;
      }

      // Yaw-invariant 3D anatomical knee flexion check (invariant to Walk yaw & 360-deg HappySpin!)
      const hipsRightAxis = b.hips
        ? new THREE.Vector3(1, 0, 0).transformDirection(b.hips.matrixWorld).normalize()
        : new THREE.Vector3(1, 0, 0);
      const calcKneeBend = (upW, kneeW, footW) => {
        const uThigh = new THREE.Vector3(kneeW[0] - upW[0], kneeW[1] - upW[1], kneeW[2] - upW[2]).normalize();
        const uShin = new THREE.Vector3(footW[0] - kneeW[0], footW[1] - kneeW[1], footW[2] - kneeW[2]).normalize();
        const crossVec = new THREE.Vector3().crossVectors(uThigh, uShin);
        return Math.atan2(crossVec.dot(hipsRightAxis), uThigh.dot(uShin));
      };
      const leftKneeBendRad = calcKneeBend(lUpLegW, lLegW, lFootW);
      const rightKneeBendRad = calcKneeBend(rUpLegW, rLegW, rFootW);

      // Exact hand-tip to headSolidSdf surface clearance in Head-local frame!
      let handHeadSdfClearance = 9.99;
      if (b.head && b.leftHand && b.rightHand) {
        tmpHeadInv.copy(b.head.matrixWorld).invert();
        [b.leftHand, b.rightHand].forEach((handBone, idx) => {
          const s = idx === 0 ? -1 : 1;
          // Evaluate both wrist/hand joint and rounded paw tip!
          [new THREE.Vector3(0, 0, 0), new THREE.Vector3(s * 0.095, -0.018, 0.015)].forEach((localPt) => {
            tmpDiagC.copy(localPt).applyMatrix4(handBone.matrixWorld).applyMatrix4(tmpHeadInv);
            const sdfD = headSolidSdf(tmpDiagC.x, tmpDiagC.y + 0.96, tmpDiagC.z);
            if (sdfD < handHeadSdfClearance) handHeadSdfClearance = sdfD;
          });
        });
      }

      // Sample CPU-skinned body vertices for true lowest rendered vertex Y
      let minSkinnedBodyY = 9.99;
      if (bodySkinnedRef && typeof bodySkinnedRef.getVertexPosition === 'function') {
        bodySkinnedRef.skeleton.update();
        const vCount = bodySkinnedRef.geometry.attributes.position.count;
        const stride = Math.max(1, Math.floor(vCount / 600));
        for (let vi = 0; vi < vCount; vi += stride) {
          bodySkinnedRef.getVertexPosition(vi, tmpDiagA);
          tmpDiagA.applyMatrix4(bodySkinnedRef.matrixWorld);
          if (tmpDiagA.y < minSkinnedBodyY) minSkinnedBodyY = tmpDiagA.y;
        }
      }

      return {
        currentActionName,
        actionTime: currentAction ? Number(currentAction.time.toFixed(4)) : 0,
        actionDuration: currentAction ? Number(currentAction.getClip().duration.toFixed(4)) : 0,
        pivotY: Number(characterPivot.position.y.toFixed(4)),
        hipsW,
        headW,
        lArmW,
        rArmW,
        lHandW,
        rHandW,
        lFootW,
        rFootW,
        leftArmElevationDeg: Number(leftArmElevationDeg.toFixed(2)),
        rightArmElevationDeg: Number(rightArmElevationDeg.toFixed(2)),
        leftSoleY: Number(leftSoleY.toFixed(4)),
        rightSoleY: Number(rightSoleY.toFixed(4)),
        stanceSoleY: Number(Math.min(leftSoleY, rightSoleY).toFixed(4)),
        minSkinnedBodyY: Number(minSkinnedBodyY.toFixed(4)),
        leftKneeBendRad: Number(leftKneeBendRad.toFixed(4)),
        rightKneeBendRad: Number(rightKneeBendRad.toFixed(4)),
        handHeadSdfClearance: Number(handHeadSdfClearance.toFixed(4)),
        stageYawRad: Number(stageGroup.rotation.y.toFixed(4)),
        speechRemainingSec: Number(facialRig.speechRemainingSec.toFixed(3)),
        uBlink: facialRig.eyeMats[0] ? Number(facialRig.eyeMats[0].uniforms.uBlink.value.toFixed(3)) : 0,
        uHappySquint: facialRig.eyeMats[0] ? Number(facialRig.eyeMats[0].uniforms.uHappySquint.value.toFixed(3)) : 0,
        uOpen: facialRig.mouthMat ? Number(facialRig.mouthMat.uniforms.uOpen.value.toFixed(3)) : 0,
        uSmile: facialRig.mouthMat ? Number(facialRig.mouthMat.uniforms.uSmile.value.toFixed(3)) : 0,
        uRoundO: facialRig.mouthMat ? Number(facialRig.mouthMat.uniforms.uRoundO.value.toFixed(3)) : 0
      };
    }

    // Deterministic Multi-Frame Filmstrip Pose Helper for Automated Motion Verification
    function poseForCapture(actionName, normalizedU = 0.0, opts = {}) {
      if (!mixer) return null;
      qaManualMode = true;
      const targetName = normalizeActionName(actionName);
      const act = actions[targetName];
      if (!act) return null;

      mixer.stopAllAction();
      clearSparkles();
      Object.values(springs).forEach((sp) => { sp.pos = 0; sp.vel = 0; sp.target = 0; });

      dragState.active = !!opts.drag;
      dragState.vx = opts.vx || 0;
      dragState.vy = opts.vy || 0;
      dragState.blend = dragState.active || opts.fall ? 1.0 : 0.0;
      fallState.active = !!opts.fall;
      fallState.vy = opts.fallVy || 0;
      petState.active = !!opts.pet;
      facingDirection = typeof opts.facing === 'number' ? opts.facing : 0;
      stageYawOverride = typeof opts.yaw === 'number' ? opts.yaw : null;
      facialRig.blinkValue = typeof opts.blink === 'number' ? opts.blink : 0.0;
      facialRig.speechRemainingSec = typeof opts.speechSec === 'number' ? opts.speechSec : 0.0;
      facialRig.saccadeOffset.set(0, 0);
      gazeState.attentionWeight = 1.0;
      gazeState.currentWeight = 1.0;
      gazeState.wanderX = 0.0;
      gazeState.wanderY = 0.0;
      updateCursorTarget(opts.cursorX || 0, opts.cursorY || 0);
      cursorHeadSmoothed.x = cursorTarget.x;
      cursorHeadSmoothed.y = cursorTarget.y;
      cursorBodySmoothed.x = cursorTarget.x;
      cursorBodySmoothed.y = cursorTarget.y;

      currentAction = act;
      currentActionName = targetName;
      const dur = act.getClip().duration || 1.0;
      const clampedU = LOOPING_ACTIONS.has(targetName)
        ? ((normalizedU % 1.0) + 1.0) % 1.0
        : Math.max(0, Math.min(0.9999, normalizedU));

      restorePostMixerState();
      // Reset procedural nodes to bind rest before evaluating single clip cleanly
      for (let i = 0; i < proceduralNodes.length; i++) {
        const n = proceduralNodes[i];
        n.position.copy(n.userData.restPos);
        n.quaternion.copy(n.userData.restQuat);
        n.scale.copy(n.userData.restScale);
      }

      act.reset();
      act.enabled = true;
      act.setEffectiveWeight(1.0);
      act.play();
      mixer.setTime(clampedU * dur);
      capturePostMixerState();

      // Converge stage yaw & expression smoothing cleanly for this exact frame
      const simTime = clampedU * dur;
      for (let k = 0; k < 10; k++) {
        restorePostMixerState();
        applyLayeredGazeAndSpringPhysics(0.033, simTime);
        updateFacialAndEyes(0.033, simTime);
      }
      updateContactShadow();
      renderer.render(scene, camera);
      return getMotionDiagnostics();
    }

    function resumeLiveLoop() {
      qaManualMode = false;
      stageYawOverride = null;
      clock.getDelta();
      return true;
    }

    function captureCanvasPng() {
      renderer.render(scene, camera);
      return renderer.domElement.toDataURL('image/png');
    }

    window.getMotionDiagnostics = getMotionDiagnostics;
    window.poseForCapture = poseForCapture;
    window.captureCanvasPng = captureCanvasPng;
    window.resumeLiveLoop = resumeLiveLoop;

    function animate() {
      requestAnimationFrame(animate);
      if (qaManualMode) {
        renderer.render(scene, camera);
        return;
      }

      const dt = Math.min(clock.getDelta(), 0.05);
      microLife.time += dt;

      // 1. Restore all procedural nodes to clean post-mixer state (zero drift)
      restorePostMixerState();

      // 2. Advance AnimationMixer & smooth spline crossfades
      if (mixer) {
        mixer.update(dt);
      }

      // 3. Snapshot clean mixer pose
      capturePostMixerState();

      // 4. Layer 5-stage gaze, 66.5/74.5-deg side-stride yaw, spring physics, fidgets & drag/fall
      applyLayeredGazeAndSpringPhysics(dt, microLife.time);

      // 5. Update alpha-cutout blinking, happy eyes, natural Idle/Speech mouth & blush
      updateFacialAndEyes(dt, microLife.time);

      // 6. Update dual-foot soft contact shadow & starburst sparkles
      updateContactShadow();
      updateSparkles(dt);

      // 5. Meadow Grass Strip, 2-3s Footprints, Grass Tuft Particles & Emotion Emotes
      const shadowGroundY = shadowPlane.position.y;
      if (meadowStripMesh) {
        meadowStripMesh.position.y = shadowGroundY + 0.004;
        meadowUniforms.uTime.value = microLife.time;
        if (rigBones.leftFoot && rigBones.rightFoot) {
          rigBones.leftFoot.getWorldPosition(tmpVecL);
          rigBones.rightFoot.getWorldPosition(tmpVecR);
          const lPress = Math.max(0, 1.0 - Math.max(0, tmpVecL.y - 0.035) * 18.0);
          const rPress = Math.max(0, 1.0 - Math.max(0, tmpVecR.y - 0.035) * 18.0);
          meadowUniforms.uLeftFoot.value.set(tmpVecL.x, tmpVecL.z, lPress);
          meadowUniforms.uRightFoot.value.set(tmpVecR.x, tmpVecR.z, rPress);
        }
      }

      const isWalkingOrRunning = (currentActionName === 'Walk' || currentActionName === 'Run');
      if (isWalkingOrRunning && !dragState.active && !fallState.active && rigBones.leftFoot && rigBones.rightFoot) {
        tmpDiagA.set(0, -0.035, 0.015).applyMatrix4(rigBones.leftFoot.matrixWorld);
        tmpDiagB.set(0, -0.035, 0.015).applyMatrix4(rigBones.rightFoot.matrixWorld);
        const lGround = tmpDiagA.y <= 0.012;
        const rGround = tmpDiagB.y <= 0.012;
        stepDetector.leftCooldown = Math.max(0, stepDetector.leftCooldown - dt);
        stepDetector.rightCooldown = Math.max(0, stepDetector.rightCooldown - dt);

        if (lGround && (!stepDetector.leftWasDown || stepDetector.leftCooldown <= 0)) {
          spawnFootprint(tmpDiagA.x, tmpDiagA.z, -1, stageGroup.rotation.y);
          spawnGrassTuftBurst(tmpDiagA.x, shadowGroundY, tmpDiagA.z, currentActionName === 'Run' ? 6 : 4);
          springs.landingSquash.impulse(currentActionName === 'Run' ? -0.42 : -0.24);
          stepDetector.leftCooldown = currentActionName === 'Run' ? 0.21 : 0.30;
        }
        if (rGround && (!stepDetector.rightWasDown || stepDetector.rightCooldown <= 0)) {
          spawnFootprint(tmpDiagB.x, tmpDiagB.z, 1, stageGroup.rotation.y);
          spawnGrassTuftBurst(tmpDiagB.x, shadowGroundY, tmpDiagB.z, currentActionName === 'Run' ? 6 : 4);
          springs.landingSquash.impulse(currentActionName === 'Run' ? -0.42 : -0.24);
          stepDetector.rightCooldown = currentActionName === 'Run' ? 0.21 : 0.30;
        }
        stepDetector.leftWasDown = lGround;
        stepDetector.rightWasDown = rGround;
      } else {
        stepDetector.leftWasDown = false;
        stepDetector.rightWasDown = false;
      }

      updateFootprintsAndGrass(dt, shadowGroundY);
      updateEmotes(dt);

      // 6. Active Special Feature Real-Time Render Updates
      if (spiderSwingState.active) {
        rainbowWebLine.visible = true;
        webAnchorMesh.visible = true;
        const ax = spiderSwingState.anchorX || (spiderSwingState.dir * 2.2);
        const ay = spiderSwingState.anchorY || 2.8;
        const az = 0.0;
        webAnchorMesh.position.set(ax, ay, az);

        let hx = 0.2, hy = 0.8, hz = 0.2;
        if (rigBones.rightArm) {
          rigBones.rightArm.getWorldPosition(tmpVecR);
          hx = tmpVecR.x;
          hy = tmpVecR.y;
          hz = tmpVecR.z;
        }

        const pts = webLineGeo.attributes.position.array;
        const segs = webLinePoints;
        for (let s = 0; s < segs; s++) {
          const frac = s / (segs - 1);
          const sag = Math.sin(frac * Math.PI) * 0.12;
          pts[s * 3]     = THREE.MathUtils.lerp(ax, hx, frac);
          pts[s * 3 + 1] = THREE.MathUtils.lerp(ay, hy, frac) - sag;
          pts[s * 3 + 2] = THREE.MathUtils.lerp(az, hz, frac);
        }
        webLineGeo.attributes.position.needsUpdate = true;
      } else {
        rainbowWebLine.visible = false;
        webAnchorMesh.visible = false;
      }

      if (magicDoodleState.lingerTime > 0) {
        magicDoodleState.lingerTime -= dt;
        magicDoodleGroup.position.y = 1.45 + Math.sin(microLife.time * 2.8) * 0.04;
        if (magicDoodleState.lingerTime <= 0) {
          magicDoodleGroup.visible = false;
        }
      }
      if (peekState.active) {
        peekState.scanTime += dt;
      }

      if (soloPlaySys) {
        soloPlaySys.updateSoloPlay(dt);
      }
      if (worldRpgSys) {
        worldRpgSys.updateWorldRPGDefense(dt, microLife.time);
      }

      renderer.render(scene, camera);
    }

    loadPpongModel().then(() => {
      try {
        soloPlaySys = createSoloPlaySubsystem({
          THREE,
          scene,
          characterPivot,
          stageGroup,
          getRigBones: () => rigBones,
          addBoneEulerOffset,
          playAnimation,
          triggerEmotionEmote,
        });
        worldRpgSys = createWorldRPGDefenseSubsystem({
          THREE,
          scene,
          camera,
          characterPivot,
          stageGroup,
          hemiLight,
          keyLight,
          backRimLight,
          pawFootprintMatTemplate,
          getRigBones: () => rigBones,
          addBoneEulerOffset,
          playAnimation,
          triggerEmotionEmote,
          soloPlaySys,
        });
      } catch (err) {
        console.error('Failed to init solo play / world RPG subsystem:', err);
      }
      animate();
    });
  </script>
</body>
</html>
