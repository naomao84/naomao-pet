    // =========================================================================
    // 10B. Build Second Minipet Character "트리" (Tree) — 3-Tiered Evergreen Hood Bear
    // =========================================================================
    function treeBellyPatchField(x, y, z) {
      if (z <= 0.14) return 0.0;
      const nx = x / 0.180;
      const ny = (y - 0.505) / 0.210;
      const r2 = nx * nx + ny * ny;
      const mask = 1.0 - smoothstep(0.68, 1.05, r2);
      const frontMask = smoothstep(0.16, 0.28, z);
      return mask * frontMask;
    }

    function treeBodySdf(x, y, z) {
      const ax = Math.abs(x);

      // 1. Plump caramel-tan pear/chubby bear torso
      const lower = sdEllipsoid(x, y, z, 0, 0.44, 0.015, 0.375, 0.315, 0.355);
      const upper = sdEllipsoid(x, y, z, 0, 0.72, 0.005, 0.315, 0.240, 0.295);
      const collar = sdCapsule(x, y, z, 0, 0.78, 0, 0, 0.96, 0, 0.205, 0.165);
      let d = smin(lower, upper, 0.105);
      d = smin(d, collar, 0.055);

      // 2. Raised 3D oval cocoa belly patch (+1.6cm physical cushion bump)
      const bellyMask = treeBellyPatchField(x, y, z);
      if (bellyMask > 0.001) {
        d -= 0.016 * bellyMask;
      }

      // 3. Cute short chubby bear legs planted cleanly at y = 0.000
      const legThigh = sdCapsule(ax, y, z, 0.172, 0.28, 0.00, 0.178, 0.095, 0.010, 0.128, 0.114);
      const footSole = sdEllipsoid(ax, y, z, 0.180, 0.052, 0.024, 0.112, 0.054, 0.126);
      let leg = smin(legThigh, footSole, 0.032);
      leg = Math.max(leg, -y);

      d = smin(d, leg, 0.036);

      // Clean center thigh inner-crotch separation
      const crotchGap = sdCapsule(x, y, z, 0, -0.02, -0.10, 0, 0.22, 0.16, 0.052, 0.044);
      d = smax(d, -crotchGap, 0.018);

      // 4. Short chubby bear arms in -12 deg A-bind pose (aligned with arm bones)
      const armUpper = sdCapsule(ax, y, z, 0.220, 0.770, 0.010, 0.415, 0.725, 0.032, 0.098, 0.092);
      const armLower = sdCapsule(ax, y, z, 0.415, 0.725, 0.032, 0.545, 0.692, 0.052, 0.092, 0.088);
      const paw = sdEllipsoid(ax, y, z, 0.565, 0.686, 0.056, 0.092, 0.086, 0.088);
      let arm = smin(armUpper, armLower, 0.025);
      arm = smin(arm, paw, 0.025);

      d = smin(d, arm, 0.034);
      return d;
    }

    function treeTailSdf(x, y, z) {
      return sdEllipsoid(x, y, z, 0, 0.365, -0.375, 0.098, 0.096, 0.098);
    }

    function sdTreeBellTier(x, y, z, yBot, yTop, rBot, rTop, flarePow, roundR) {
      const h = yTop - yBot;
      const t = Math.max(0.0, Math.min(1.0, (y - yBot) / h));
      const profile = Math.pow(1.0 - t, flarePow);
      const rTarget = (rTop + (rBot - rTop) * profile) - roundR;

      const rHoriz = Math.hypot(x, z * 1.04);
      const dRad = rHoriz - Math.max(0.01, rTarget);
      const dBot = (yBot + roundR) - y;
      const dTop = y - (yTop - roundR);
      const dVert = Math.max(dBot, dTop);

      const outR = Math.max(dRad, 0.0);
      const outY = Math.max(dVert, 0.0);
      return Math.hypot(outR, outY) + Math.min(Math.max(dRad, dVert), 0.0) - roundR;
    }

    function treeHoodOuterShellSdf(x, y, z) {
      const zTier1 = z - 0.010 * smoothstep(1.52, 1.93, y);
      const tier1 = sdTreeBellTier(x, y, zTier1, 1.50, 1.94, 0.455, 0.085, 0.90, 0.054);
      const tier2 = sdTreeBellTier(x, y, z + 0.005, 1.18, 1.58, 0.585, 0.340, 0.88, 0.062);
      const tier3 = sdTreeBellTier(x, y, z + 0.012, 0.88, 1.27, 0.695, 0.465, 0.86, 0.068);

      let hood = smin(tier1, tier2, 0.022);
      hood = smin(hood, tier3, 0.024);

      const rHoriz = Math.hypot(x, z * 1.04);
      const g12 = Math.exp(-Math.pow((y - 1.515) / 0.030, 2)) * smoothstep(0.32, 0.46, rHoriz);
      const g23 = Math.exp(-Math.pow((y - 1.200) / 0.032, 2)) * smoothstep(0.44, 0.58, rHoriz);
      hood += 0.016 * (g12 + g23);

      const underHollow = sdEllipsoid(x, y, z, 0, 0.86, 0.01, 0.36, 0.075, 0.34);
      hood = smax(hood, -underHollow, 0.025);

      return hood;
    }

    function treeInnerFaceSdf(x, y, z) {
      const headCore = sdEllipsoid(x, y, z, 0, 1.19, 0.135, 0.365, 0.305, 0.365);
      const cheekPouch = sdEllipsoid(x, y, z, 0, 1.11, 0.215, 0.355, 0.210, 0.315);
      return smin(headCore, cheekPouch, 0.075);
    }

    function treeHoodCutoutOnlySdf(x, y, z) {
      const hoodOuter = treeHoodOuterShellSdf(x, y, z);
      const cutY = y - 1.165;
      const archRx = 0.338 - 0.045 * smoothstep(-0.10, 0.25, cutY);
      const archRy = 0.258;
      const cutout = sdEllipsoid(x, y, z, 0, 1.165, 0.365, archRx, archRy, 0.340);
      return smax(hoodOuter, -cutout, 0.042);
    }

    function treeHeadAndHoodSdf(x, y, z) {
      const hoodWithOpening = treeHoodCutoutOnlySdf(x, y, z);
      const innerFace = treeInnerFaceSdf(x, y, z);
      return smin(hoodWithOpening, innerFace, 0.012);
    }

    function projectOntoTreeFaceSurface(x, y) {
      let z = 0.55;
      for (let step = 0; step < 36; step++) {
        const d = treeInnerFaceSdf(x, y, z);
        if (Math.abs(d) < 0.0002) break;
        z -= d * 0.85;
      }
      const eps = 0.002;
      const nx = treeInnerFaceSdf(x + eps, y, z) - treeInnerFaceSdf(x - eps, y, z);
      const ny = treeInnerFaceSdf(x, y + eps, z) - treeInnerFaceSdf(x, y - eps, z);
      const nz = treeInnerFaceSdf(x, y, z + eps) - treeInnerFaceSdf(x, y, z - eps);
      return {
        point: new THREE.Vector3(x, y, z),
        normal: new THREE.Vector3(nx, ny, nz).normalize()
      };
    }

    function buildConformalTreeFacePatch(cx, cy, rx, ry, segsU, segsV, thicknessFn, parentWorld) {
      const geo = new THREE.PlaneGeometry(2, 2, segsU, segsV);
      const pos = geo.attributes.position;
      const norm = geo.attributes.normal;

      for (let i = 0; i < pos.count; i++) {
        const u = pos.getX(i);
        const v = pos.getY(i);
        const r2 = Math.min(1.5, u * u + v * v);
        const dome = Math.max(0, 1.0 - r2);

        const wx = cx + u * rx;
        const wy = cy + v * ry;
        const surf = projectOntoTreeFaceSurface(wx, wy);

        const lift = thicknessFn.base + thicknessFn.dome * dome;
        const px = surf.point.x + surf.normal.x * lift - parentWorld.x;
        const py = surf.point.y + surf.normal.y * lift - parentWorld.y;
        const pz = surf.point.z + surf.normal.z * lift - parentWorld.z;

        pos.setXYZ(i, px, py, pz);

        const nOut = surf.normal.clone();
        nOut.x += u * 0.16 * (thicknessFn.dome > 0 ? 1 : 0);
        nOut.y += v * 0.16 * (thicknessFn.dome > 0 ? 1 : 0);
        nOut.normalize();
        norm.setXYZ(i, nOut.x, nOut.y, nOut.z);
      }

      pos.needsUpdate = true;
      norm.needsUpdate = true;
      return geo;
    }

    function projectOntoTreeHoodSurface(angleFromFrontRad, y) {
      const dirX = Math.sin(angleFromFrontRad);
      const dirZ = Math.cos(angleFromFrontRad);
      let r = 0.85;
      for (let step = 0; step < 40; step++) {
        const px = dirX * r;
        const pz = dirZ * r;
        const d = treeHoodOuterShellSdf(px, y, pz);
        if (Math.abs(d) < 0.0002) break;
        r -= d * 0.82;
      }
      const px = dirX * r;
      const pz = dirZ * r;
      const eps = 0.002;
      const nx = treeHoodOuterShellSdf(px + eps, y, pz) - treeHoodOuterShellSdf(px - eps, y, pz);
      const ny = treeHoodOuterShellSdf(px, y + eps, pz) - treeHoodOuterShellSdf(px, y - eps, pz);
      const nz = treeHoodOuterShellSdf(px, y, pz + eps) - treeHoodOuterShellSdf(px, y, pz - eps);
      return {
        point: new THREE.Vector3(px, y, pz),
        normal: new THREE.Vector3(nx, ny, nz).normalize()
      };
    }

    function buildTreeStarGeometry() {
      const ringSegs = 60;
      const latSegs = 28;
      const rOuter = 0.142;
      const rInner = 0.068;
      const maxThick = 0.050;

      const positions = [];
      const uvs = [];
      const indices = [];

      for (let iy = 0; iy <= latSegs; iy++) {
        const v = iy / latSegs;
        const phi = (v - 0.5) * Math.PI;
        const cosPhi = Math.cos(phi);
        const sinPhi = Math.sin(phi);

        const radialFrac = Math.pow(Math.max(0, cosPhi), 0.88);
        const zProfile = Math.sign(sinPhi) * Math.pow(Math.abs(sinPhi), 0.82);

        for (let ix = 0; ix <= ringSegs; ix++) {
          const u = ix / ringSegs;
          const theta = u * Math.PI * 2.0 + Math.PI * 0.5;

          const wave = 0.5 + 0.5 * Math.cos(5.0 * (theta - Math.PI * 0.5));
          const smoothWave = Math.pow(wave, 1.15);
          const starR = THREE.MathUtils.lerp(rInner, rOuter, smoothWave);

          const r = starR * radialFrac;
          const x = Math.cos(theta) * r;
          const y = Math.sin(theta) * r;

          const centerRidge = 1.0 - 0.42 * radialFrac * (1.0 - 0.35 * smoothWave);
          const z = zProfile * maxThick * centerRidge;

          positions.push(x, y, z);
          uvs.push(u, v);
        }
      }

      const stride = ringSegs + 1;
      for (let iy = 0; iy < latSegs; iy++) {
        for (let ix = 0; ix < ringSegs; ix++) {
          const a = iy * stride + ix;
          const b = a + 1;
          const c = a + stride;
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function createTreeBeadEyeMaterial() {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        uniforms: {
          uPupilOffset: { value: new THREE.Vector2(0, 0) },
          uBlink: { value: 0.0 },
          uHappySquint: { value: 0.0 },
          uPupilScale: { value: 1.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormalView;
          varying vec3 vViewPos;
          void main() {
            vUv = uv;
            vNormalView = normalize(normalMatrix * normal);
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewPos = -mvPos.xyz;
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          varying vec3 vNormalView;
          varying vec3 vViewPos;
          uniform vec2 uPupilOffset;
          uniform float uBlink;
          uniform float uHappySquint;
          uniform float uPupilScale;

          void main() {
            vec2 p = (vUv - 0.5) * 2.0;
            float r = length(p);
            float eyeMask = 1.0 - smoothstep(0.88, 0.98, r);
            if (eyeMask <= 0.002) discard;

            vec2 gp = p - uPupilOffset * 0.22;
            vec3 col = vec3(0.115, 0.072, 0.062);

            float lowerWarm = smoothstep(-0.15, -0.78, gp.y) * (1.0 - smoothstep(0.0, 0.78, length(gp)));
            col = mix(col, vec3(0.24, 0.145, 0.115), lowerWarm * 0.55);

            vec3 N = normalize(vNormalView);
            vec3 V = normalize(vViewPos);
            float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.8);
            col += vec3(0.32, 0.25, 0.22) * fres * 0.28;

            float spec1 = 1.0 - smoothstep(0.14, 0.22, length(gp - vec2(-0.26, 0.28)));
            float spec2 = 1.0 - smoothstep(0.06, 0.12, length(gp - vec2(0.24, -0.24)));
            col = mix(col, vec3(1.0), clamp(spec1 * 0.92 + spec2 * 0.65, 0.0, 1.0));

            vec3 lineCol = vec3(0.12, 0.075, 0.065);

            float lidTopY = mix(1.12, -0.74, clamp(uBlink, 0.0, 1.0));
            float upperCover = smoothstep(lidTopY - 0.07, lidTopY + 0.05, p.y);

            float archCurve = -0.18 + 0.42 * (1.0 - p.x * p.x);
            float squintBotY = mix(-1.15, archCurve, clamp(uHappySquint, 0.0, 1.0));
            float lowerCover = 1.0 - smoothstep(squintBotY - 0.06, squintBotY + 0.06, p.y);

            float lidMask = clamp(max(upperCover, lowerCover * uHappySquint), 0.0, 1.0);
            float openEyeAlpha = eyeMask * (1.0 - lidMask);

            float blinkCrease = (1.0 - smoothstep(0.0, 0.11, abs(p.y - lidTopY))) * smoothstep(0.08, 0.35, uBlink);
            float happyCrease = (1.0 - smoothstep(0.0, 0.12, abs(p.y - archCurve))) * smoothstep(0.12, 0.45, uHappySquint);
            float creaseAlpha = clamp(max(blinkCrease, happyCrease), 0.0, 1.0) * eyeMask;

            float finalAlpha = max(openEyeAlpha, creaseAlpha);
            if (finalAlpha <= 0.005) discard;

            float creaseMix = clamp(creaseAlpha / max(0.01, finalAlpha) * (0.45 + 0.55 * lidMask), 0.0, 1.0);
            vec3 finalCol = mix(col, lineCol, creaseMix);

            gl_FragColor = vec4(finalCol, finalAlpha);
          }
        `
      });
    }

    function createTreeBlushPadMaterial() {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        uniforms: {
          uIntensity: { value: 0.78 },
          uColor: { value: new THREE.Color(0xe67f8b) }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uIntensity;
          uniform vec3 uColor;
          varying vec2 vUv;
          void main() {
            vec2 p = (vUv * 2.0 - 1.0) / vec2(0.95, 0.72);
            float d = length(p);
            float alpha = (1.0 - smoothstep(0.74, 1.0, d)) * min(0.88, uIntensity * 1.05);
            if (alpha <= 0.004) discard;
            vec3 c = mix(uColor * 0.94, uColor * 1.05, 1.0 - clamp(d, 0.0, 1.0));
            gl_FragColor = vec4(c, alpha);
          }
        `
      });
    }

    function createTreeMouthMaterial() {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        uniforms: {
          uOpen: { value: 0.20 },
          uWidth: { value: 0.96 },
          uSmile: { value: 0.66 },
          uRoundO: { value: 0.0 },
          uTongueBounce: { value: 0.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform float uOpen;
          uniform float uWidth;
          uniform float uSmile;
          uniform float uRoundO;
          uniform float uTongueBounce;

          void main() {
            vec2 p = (vUv - 0.5) * 2.0;
            p.x /= max(0.55, uWidth);

            vec3 lineCol = vec3(0.135, 0.082, 0.070);
            vec3 cavityCol = vec3(0.42, 0.14, 0.16);
            vec3 tongueCol = vec3(0.94, 0.47, 0.55);

            // Crisp curved 'U' smile arc in default Idle (matches reference turnaround image!)
            float smileBend = max(0.15, (uSmile - 0.25) * 0.95);
            float arcW = 0.56;
            float xc = clamp(p.x, -arcW, arcW);
            float curveY = -0.18 + smileBend * ((xc / arcW) * (xc / arcW) * 0.55);
            float dSmileArc = length(vec2(p.x - xc, p.y - curveY));
            float strokeAlpha = 1.0 - smoothstep(0.095, 0.145, dSmileArc);

            // Open mouth cavity only when talking/cheering (uOpen > 0.36)
            float openAmt = smoothstep(0.36, 0.95, uOpen);
            float h = mix(0.04, 0.42, openAmt);
            float w = mix(0.46, 0.28, uRoundO);

            float topY = 0.08 - (1.0 - uRoundO) * 0.16 * (p.x * p.x);
            float botY = topY - h * (1.0 - 0.55 * (p.x / max(0.15, w)) * (p.x / max(0.15, w)));

            float inX = 1.0 - smoothstep(w - 0.05, w + 0.03, abs(p.x));
            float inY = smoothstep(botY - 0.03, botY + 0.03, p.y) * (1.0 - smoothstep(topY - 0.03, topY + 0.03, p.y));
            float openMask = inX * inY * openAmt;

            float tongueDist = length(vec2(p.x * 0.95, p.y - (botY + h * 0.16 + uTongueBounce * 0.45)));
            float tongueMask = (1.0 - smoothstep(0.16, 0.22, tongueDist)) * openMask;
            vec3 insideCol = mix(cavityCol, tongueCol, tongueMask);

            float rimMask = (1.0 - smoothstep(w, w + 0.09, abs(p.x)))
                          * (1.0 - smoothstep(0.0, 0.085, min(abs(p.y - topY), abs(p.y - botY))))
                          * inX * openAmt;

            float closedAlpha = strokeAlpha * (1.0 - openAmt * 0.85);
            float totalAlpha = clamp(max(closedAlpha, max(openMask, rimMask)), 0.0, 1.0);
            if (totalAlpha <= 0.005) discard;

            vec3 finalCol = mix(lineCol, insideCol, clamp(openMask * (1.0 - rimMask * 0.65), 0.0, 1.0));
            gl_FragColor = vec4(finalCol, totalAlpha);
          }
        `
      });
    }

    function buildProceduralTree(cachedGeos = null, outFacialRig = facialRig, isPartner = false) {

      const bearBodyMat = createSoftVinylMaterial({

        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
          const ax = Math.abs(x);
          const rHoriz = Math.hypot(x, z * 1.04);

          const dFace = treeInnerFaceSdf(x, y, z);

          const cutY = y - 1.165;
          const archRx = Math.max(0.15, 0.338 - 0.045 * smoothstep(-0.10, 0.25, cutY));

          skinSample.multiplyScalar(1.0 - 0.14 * smoothstep(0.75, 0.96, rimProx));

          const step12 = Math.exp(-Math.pow((y - 1.505) / 0.038, 2)) * smoothstep(0.30, 0.45, rHoriz);
          const step23 = Math.exp(-Math.pow((y - 1.190) / 0.040, 2)) * smoothstep(0.42, 0.56, rHoriz);
          const underBrim = 1.0 - smoothstep(0.89, 0.98, y);
          const hoodSample = new THREE.Color().copy(treeGreenBase)
            .lerp(treeGreenTop, smoothstep(0.95, 1.88, y) * 0.45)

      return root;
    }

    function step2(edge, val) {
      return val >= edge ? 1.0 : 0.0;

    // =========================================================================
    // 11. Full 25-Bone Discovery & Smooth Spline Game-Animation Synthesizer
    // =========================================================================
    function discoverRigBonesInto(root, targetBones) {
      Object.keys(targetBones).forEach((k) => { targetBones[k] = null; });

      const candidates = [];
      root.traverse((obj) => {
        if (obj.isBone || obj.type === 'Bone' || obj.userData.isRigNode) {
          candidates.push(obj);
        }
      });

      const pick = (regex, exclude = null) => {
        for (const b of candidates) {
          if (exclude && exclude.test(b.name)) continue;
          if (regex.test(b.name)) return b;
        }
        return null;
      };

      targetBones.hips = pick(/^hips$|pelvis|root_bone|bip001$/i, /end/i);
      targetBones.spine = pick(/^spine$|spine01|spine1/i, /end/i);
      targetBones.chest = pick(/^chest$|upperchest|spine02|spine2/i, /end/i) || targetBones.spine;
      targetBones.neck = pick(/neck/i, /end|nub/i);
      targetBones.head = pick(/^head$|mixamorig.*head|bip.*head/i, /end|top|nub|eye|ear|horn/i);
      targetBones.leftEar = pick(/leftear|ear.*left|ear_l|ear\.l/i, /end/i);
      targetBones.rightEar = pick(/rightear|ear.*right|ear_r|ear\.r/i, /end/i);
      targetBones.horn = pick(/horn/i, /end/i);

      targetBones.leftShoulder = pick(/(left|l_).*(shoulder|clavicle)|(shoulder|clavicle).*(left|_l)/i, /end/i);
      targetBones.rightShoulder = pick(/(right|r_).*(shoulder|clavicle)|(shoulder|clavicle).*(right|_r)/i, /end/i);
      targetBones.leftArm = pick(/^leftarm$|(left|l_).*(upperarm|arm)/i, /fore|lower|hand|shoulder|end/i);
      targetBones.rightArm = pick(/^rightarm$|(right|r_).*(upperarm|arm)/i, /fore|lower|hand|shoulder|end/i);
      targetBones.leftForeArm = pick(/(left|l_).*(forearm|lowerarm)/i, /hand|end/i);
      targetBones.rightForeArm = pick(/(right|r_).*(forearm|lowerarm)/i, /hand|end/i);
      targetBones.leftHand = pick(/(left|l_).*hand/i, /finger|thumb|end/i);
      targetBones.rightHand = pick(/(right|r_).*hand/i, /finger|thumb|end/i);

      targetBones.leftUpLeg = pick(/^leftupleg$|(left|l_).*(upleg|thigh|upperleg)/i, /end/i);
      targetBones.rightUpLeg = pick(/^rightupleg$|(right|r_).*(upleg|thigh|upperleg)/i, /end/i);
      targetBones.leftLeg = pick(/^leftleg$|(left|l_).*(calf|shin|lowerleg)/i, /up|foot|end/i);
      targetBones.rightLeg = pick(/^rightleg$|(right|r_).*(calf|shin|lowerleg)/i, /up|foot|end/i);
      targetBones.leftFoot = pick(/(left|l_).*foot/i, /toe|end/i);
      targetBones.rightFoot = pick(/(right|r_).*foot/i, /toe|end/i);

      targetBones.tailBase = pick(/tailbase|^tail$|tail01|tail1/i, /end/i);
      targetBones.tailMid = pick(/tailmid|tail02|tail2/i, /end/i);
      targetBones.tailTip = pick(/tailtip|tail03|tail3/i, /end/i);
    }

    function discoverRigBones(root) {
      discoverRigBonesInto(root, rigBones);
    }

    // High-density SLERP quaternion (with hemisphere sign continuity for 360-deg spins!)
    // & Catmull-Rom spline vector keyframe track builders
    function makeQuatTrack(node, times, eulerSamples) {
      const values = [];
      const baseQuat = node.userData.restQuat || node.quaternion;
      const qDelta = new THREE.Quaternion();
      const euler = new THREE.Euler();
      let prevQ = null;

      for (const [rx, ry, rz] of eulerSamples) {
        euler.set(rx, ry, rz, 'ZYX');
        qDelta.setFromEuler(euler);
        const qFinal = baseQuat.clone().multiply(qDelta);
        if (prevQ && prevQ.dot(qFinal) < 0) {
          qFinal.set(-qFinal.x, -qFinal.y, -qFinal.z, -qFinal.w);
        }
        prevQ = qFinal.clone();
        values.push(qFinal.x, qFinal.y, qFinal.z, qFinal.w);
      }
      return new THREE.QuaternionKeyframeTrack(`${node.uuid}.quaternion`, times, values);
    }

    function makePosTrack(node, times, offsetSamples, smooth = true, periodic = false) {
      const values = [];
      const basePos = node.userData.restPos || node.position;
      for (const [dx, dy, dz] of offsetSamples) {
        values.push(basePos.x + dx, basePos.y + dy, basePos.z + dz);
      }
      const track = new THREE.VectorKeyframeTrack(`${node.uuid}.position`, times, values);
      if (smooth && !periodic) track.setInterpolation(THREE.InterpolateSmooth);
      return track;
    }

    function makeScaleTrack(node, times, scaleMultipliers, smooth = true, periodic = false) {
      const values = [];
      const baseScale = node.userData.restScale || node.scale;
      for (const [sx, sy, sz] of scaleMultipliers) {
        values.push(baseScale.x * sx, baseScale.y * sy, baseScale.z * sz);
      }
      const track = new THREE.VectorKeyframeTrack(`${node.uuid}.scale`, times, values);
      if (smooth && !periodic) track.setInterpolation(THREE.InterpolateSmooth);
      return track;
    }

    function padMissingBoneTracks(clip) {
      if (!clip || !clip.tracks) return;
      const dur = Math.max(0.1, clip.duration || 1.0);
      const existing = new Set(clip.tracks.map((t) => t.name));
      const b = rigBones;
      const allRigNodes = [
        characterPivot, b.hips, b.spine, b.chest, b.neck, b.head,
        b.leftEar, b.rightEar, b.horn,
        b.leftShoulder, b.leftArm, b.leftForeArm, b.leftHand,
        b.rightShoulder, b.rightArm, b.rightForeArm, b.rightHand,
        b.leftUpLeg, b.leftLeg, b.leftFoot,
        b.rightUpLeg, b.rightLeg, b.rightFoot,
        b.tailBase, b.tailMid, b.tailTip
      ];
      for (let i = 0; i < allRigNodes.length; i++) {
        const node = allRigNodes[i];
        if (!node) continue;
        if (!existing.has(`${node.uuid}.quaternion`)) {
          clip.tracks.push(makeQuatTrack(node, [0, dur], [[0, 0, 0], [0, 0, 0]]));
        }
      }
      if (!existing.has(`${characterPivot.uuid}.position`)) {
        clip.tracks.push(makePosTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]], false, true));
      }
      if (b.chest && !existing.has(`${b.chest.uuid}.scale`)) {
        clip.tracks.push(makeScaleTrack(b.chest, [0, dur], [[1, 1, 1], [1, 1, 1]], false, true));
      }
    }

    // Analytical FK Sole Clamp: pins the lower stance foot sole strictly to y = 0.000
    // accounting for pelvic Z-roll (hipRz), pelvic X-pitch (hipPitch), leg tilt & +0.015 toe offset!
    function computeGroundedHipY(
      desiredHipDy,
      lHipRx = 0, lKneeRx = 0, lFootRx = 0, lHipRz = 0,
      rHipRx = 0, rKneeRx = 0, rFootRx = 0, rHipRz = 0,
      hipRz = 0, hipPitch = 0
    ) {
      const p1L = hipPitch + lHipRx;
      const p2L = p1L + lKneeRx;
      const p3L = p2L + lFootRx;
      const legDropL = (
        0.120 * Math.cos(p1L) +
        0.105 * Math.cos(p2L) +
        0.035 * Math.cos(p3L) +
        0.015 * Math.sin(p3L)
      ) * Math.cos(hipRz + lHipRz);

      const p1R = hipPitch + rHipRx;
      const p2R = p1R + rKneeRx;
      const p3R = p2R + rFootRx;
      const legDropR = (
        0.120 * Math.cos(p1R) +
        0.105 * Math.cos(p2R) +
        0.035 * Math.cos(p3R) +
        0.015 * Math.sin(p3R)
      ) * Math.cos(hipRz + rHipRz);

      const socketYL = -0.185 * Math.sin(hipRz) - 0.020 * Math.cos(hipRz) * Math.cos(hipPitch);
      const socketYR = +0.185 * Math.sin(hipRz) - 0.020 * Math.cos(hipRz) * Math.cos(hipPitch);

      const soleL = (0.280 + desiredHipDy) + socketYL - legDropL;
      const soleR = (0.280 + desiredHipDy) + socketYR - legDropR;
      const minSole = Math.min(soleL, soleR);
      return desiredHipDy - minSole;
    }

    // Phase-lagged wave operator & damped elastic overshoot envelope
    function waveLag(ph, lag = 0) {
      const x = ph - lag;
      return 0.90 * Math.sin(x) + 0.10 * Math.sin(2.0 * x - 0.45);
    }

    function dampedOvershoot(s) {
      const c = Math.max(0, Math.min(1, s));
      return 1.0 - Math.exp(-5.4 * c) * Math.cos(6.6 * c);
    }

    // 21 Game-Quality Multi-Joint Skeletal Clips (Verified 'ZYX' Euler Biomechanics + FK Sole Clamp)
    function synthesizeActionClip(actionName) {
      const clip = buildRawActionClip(actionName);
      if (clip) padMissingBoneTracks(clip);
      return clip;
    }

    function buildRawActionClip(actionName) {
      const tracks = [];

      // -----------------------------------------------------------------------

          const breath = Math.sin(ph * 2);      // 2 gentle breaths per 3.2s cycle
          const sway = Math.sin(ph);            // 1 contrapposto weight shift per 3.2s cycle
          const hipRoll = sway * 0.022;

          const lKnee = 0.04 + (0.5 - 0.5 * sway) * 0.05 + (1 - breath) * 0.02;
          const rKnee = 0.04 + (0.5 + 0.5 * sway) * 0.05 + (1 - breath) * 0.02;
          const lHipRx = -lKnee * 0.50;
          const rHipRx = -rKnee * 0.50;
          const lFootRx = -lKnee * 0.45;
          const rFootRx = -rKnee * 0.45;
          const hipDy = computeGroundedHipY(0, lHipRx, lKnee, lFootRx, 0, rHipRx, rKnee, rFootRx, 0, hipRoll);

          hipPos.push([sway * 0.016, hipDy, 0]);
          hipQ.push([0, sway * 0.028, hipRoll]);

          chestQ.push([-breath * 0.016, -sway * 0.016, -sway * 0.014]);

          headQ.push([breath * 0.024, sway * 0.036, -sway * 0.034]);

          lShQ.push([0, 0, 0.03 * (1 - breath)]);
          rShQ.push([0, 0, -0.03 * (1 - breath)]);
          lArmQ.push([0, 0.10 + 0.03 * sway, 0.42 - 0.035 * breath]);
          rArmQ.push([0, -0.10 + 0.03 * sway, -0.42 + 0.035 * breath]);
          lForeQ.push([0, 0.20 + 0.04 * breath, 0.06]);
          rForeQ.push([0, -0.20 - 0.04 * breath, -0.06]);

          rKneeQ.push([rKnee, 0, 0]);
          lFootQ.push([lFootRx, 0, 0]);
          rFootQ.push([rFootRx, 0, 0]);

          tail1Q.push([0.05 * breath, 0.18 * waveLag(ph, 0.0), 0]);
          tail2Q.push([0.04 * Math.cos(ph * 2), 0.24 * waveLag(ph, 0.55), 0]);

      // -----------------------------------------------------------------------

      if (actionName === 'Run') {

      // -----------------------------------------------------------------------

      if (b.leftUpLeg) tracks.push(makeQuatTrack(b.leftUpLeg, times, lUpQ));
      if (b.rightUpLeg) tracks.push(makeQuatTrack(b.rightUpLeg, times, rUpQ));
      if (b.leftLeg) tracks.push(makeQuatTrack(b.leftLeg, times, lKneeQ));
      if (b.rightLeg) tracks.push(makeQuatTrack(b.rightLeg, times, rKneeQ));
      if (b.leftFoot) tracks.push(makeQuatTrack(b.leftFoot, times, lFootQ));
      if (b.rightFoot) tracks.push(makeQuatTrack(b.rightFoot, times, rFootQ));
      if (b.tailBase) tracks.push(makeQuatTrack(b.tailBase, times, tail1Q));

      return new THREE.AnimationClip('Snack', dur, tracks);
    }

    const embeddedClipMap = {};
    function ensureAction(actionName) {
      const targetName = normalizeActionName(actionName);
      if (actions[targetName]) return actions[targetName];
      const clip = embeddedClipMap[targetName] || synthesizeActionClip(targetName);
      const act = mixer.clipAction(clip);
      if (LOOPING_ACTIONS.has(targetName)) {
        act.setLoop(THREE.LoopRepeat, Infinity);
        act.clampWhenFinished = false;
      } else {
        const clipDur = clip.duration || 1.2;
        act.setLoop(THREE.LoopOnce, clipDur < 0.55 ? 2 : 1);
        act.clampWhenFinished = true;
      }
      actions[targetName] = act;
      return act;
    }

    function bindAnimations(embeddedClips = []) {
      if (mixer) mixer.stopAllAction();
      Object.keys(actions).forEach((k) => delete actions[k]);
      Object.keys(embeddedClipMap).forEach((k) => delete embeddedClipMap[k]);
      currentAction = null;

      mixer = new THREE.AnimationMixer(characterPivot);

      const keywordMatchers = {
        Idle: ['idle', 'stand', 'breath', 'wait', 'rest'],
        Walk: ['walk', 'stroll', 'step', 'locomotion'],
        Run: ['run', 'sprint', 'trot', 'jog', 'dash'],
        Jump: ['jump', 'hop', 'leap', 'cheer', 'celebrat'],
        Wave: ['wave', 'greet', 'hello', 'hi'],
        Talk: ['talk', 'chat', 'speak', 'say', 'explain'],
        HappySpin: ['spin', 'twirl', 'pirouette'],
        Dance: ['dance', 'groove', 'boogie'],
        Stretch: ['stretch', 'yawn'],
        Curious: ['curious', 'tilt', 'inspect', 'look'],
        Sit: ['sit', 'seat', 'lounge'],
        Poke: ['poke', 'boop', 'hit', 'react'],
        Pet: ['pet', 'stroke', 'pat', 'purr'],
        DropLand: ['land', 'drop', 'impact'],
        Sleepy: ['sleep', 'drowsy', 'doze', 'nap'],
        Shy: ['shy', 'bashful', 'blush', 'timid'],
        Pout: ['pout', 'grumpy', 'sulky', 'angry', 'stomp'],
        Love: ['love', 'heart', 'adore', 'affection'],
        Sad: ['sad', 'cry', 'gloom', 'sniffle'],
        Proud: ['proud', 'confident', 'hero', 'victory'],
        Snack: ['snack', 'eat', 'munch', 'feed', 'treat']
      };

      const usedClips = new Set();
      for (const targetName of CANONICAL_ACTIONS) {
        const keywords = keywordMatchers[targetName] || [targetName.toLowerCase()];
        const found = embeddedClips.find((clip) => {
          if (usedClips.has(clip)) return false;
          const lower = (clip.name || '').toLowerCase();
          return keywords.some((kw) => lower.includes(kw));
        });
        if (found) {
          usedClips.add(found);
          embeddedClipMap[targetName] = found;
        }
      }

      if (embeddedClips.length === 1 && usedClips.size === 0) {
        embeddedClipMap.Idle = embeddedClips[0];
      }

      // Cold-start optimization: only build Idle & Wave synchronously; remaining 19 clips synthesize lazily on demand or idle warmup
      ensureAction('Idle');
      ensureAction('Wave');

      mixer.addEventListener('finished', (e) => {
        const finishedName = CANONICAL_ACTIONS.find((n) => actions[n] === e.action);
        if (finishedName && !LOOPING_ACTIONS.has(finishedName)) {
          if (facialRig.speechRemainingSec > 0.45) {
            playAnimation('Talk', { fadeDuration: 0.28, durationMs: Math.round(facialRig.speechRemainingSec * 1000) });
          } else if (petState.active) {
            playAnimation('Pet', { fadeDuration: 0.24 });
          } else {
            playAnimation('Idle', { fadeDuration: 0.30 });
          }
        }
      });

      currentAction = actions.Idle;
      currentActionName = 'Idle';
      currentAction.reset().setEffectiveWeight(1).play();
    }

    // =========================================================================
    // 12. Model Mounting & GLB Loader (Loads ppong.glb or Seamless Game Rig)
    // =========================================================================
    let isBuiltInRig = false;
    const GROUNDED_STANCE_ACTIONS = new Set([
      'Idle', 'Walk', 'Run', 'Talk', 'Pet', 'DropLand', 'Sleepy', 'Shy', 'Sad'
    ]);

    function mountModel(rawModel, embeddedAnimations = [], isProcedural = false) {
      isBuiltInRig = !!isProcedural;
      while (characterPivot.children.length > 0) {
        characterPivot.remove(characterPivot.children[0]);
      }

      if (!isProcedural) {
        rawModel.traverse((child) => {
          if (child.isMesh || child.isSkinnedMesh) {
            if (child.isSkinnedMesh) child.frustumCulled = false;
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach((m) => {
              if (!m) return;
              if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
              m.needsUpdate = true;
            });
          }
        });

        rawModel.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(rawModel);
        const size = new THREE.Vector3();
        box.getSize(size);

        if (size.y > 0.0001) {
          const targetHeight = 2.15;
          rawModel.scale.multiplyScalar(targetHeight / size.y);
          rawModel.updateMatrixWorld(true);

          const scaledBox = new THREE.Box3().setFromObject(rawModel);
          const scaledCenter = new THREE.Vector3();
          scaledBox.getCenter(scaledCenter);

          rawModel.position.x -= scaledCenter.x;
          rawModel.position.z -= scaledCenter.z;
          rawModel.position.y -= scaledBox.min.y;
        }
      }

      characterPivot.position.set(0, 0, 0);
      characterPivot.rotation.set(0, 0, 0);
      characterPivot.scale.set(1, 1, 1);
      characterPivot.add(rawModel);
      characterPivot.updateMatrixWorld(true);

      snapshotRestTransforms(characterPivot);
      discoverRigBones(rawModel);
      bindAnimations(embeddedAnimations);
    }

    function ensurePartnerAction(actionName) {
      if (!partnerMixer || !partnerReady) return null;
      const targetName = normalizeActionName(actionName);
      if (partnerActions[targetName]) return partnerActions[targetName];

      const primaryAct = ensureAction(targetName);
      const srcClip = primaryAct ? primaryAct.getClip() : (embeddedClipMap[targetName] || synthesizeActionClip(targetName));
      if (!srcClip) return null;

      const uuidMap = new Map();
      uuidMap.set(characterPivot.uuid, partnerPivot.uuid);
      Object.keys(rigBones).forEach((k) => {
        if (rigBones[k] && partnerRigBones[k]) {
          uuidMap.set(rigBones[k].uuid, partnerRigBones[k].uuid);
        }
      });

      const clonedClip = srcClip.clone();
      for (let i = 0; i < clonedClip.tracks.length; i++) {
        const tr = clonedClip.tracks[i];
        const dotIdx = tr.name.indexOf('.');
        if (dotIdx > 0) {
          const srcId = tr.name.slice(0, dotIdx);
          const prop = tr.name.slice(dotIdx);
          const dstId = uuidMap.get(srcId);
          if (dstId) tr.name = dstId + prop;
        }
      }
      const pAct = partnerMixer.clipAction(clonedClip);
      if (LOOPING_ACTIONS.has(targetName)) {
        pAct.setLoop(THREE.LoopRepeat, Infinity);
        pAct.clampWhenFinished = false;
      } else {
        const clipDur = clonedClip.duration || 1.2;
        pAct.setLoop(THREE.LoopOnce, clipDur < 0.55 ? 2 : 1);
        pAct.clampWhenFinished = true;
      }
      partnerActions[targetName] = pAct;
      return pAct;
    }

    function playPartnerAnimation(actionName, timeScale = 1.0) {
      if (!partnerReady || !partnerMixer) return false;
      const targetName = normalizeActionName(actionName);
      const nextAct = ensurePartnerAction(targetName);
      if (!nextAct) return false;
      if (partnerCurrentAction === nextAct && nextAct.isRunning()) {
        nextAct.setEffectiveTimeScale(timeScale);
        return true;
      }
      const prevAct = partnerCurrentAction;
      nextAct.reset().setEffectiveTimeScale(timeScale).setEffectiveWeight(1.0).play();
      if (prevAct && prevAct !== nextAct) {
        prevAct.crossFadeTo(nextAct, 0.18, true);
      }
      partnerCurrentAction = nextAct;
      partnerCurrentActionName = targetName;
      return true;
    }

    async function ensurePartnerRigReady() {
      if (partnerReady) return true;
      if (partnerBuildPromise) return partnerBuildPromise;
      partnerBuildPromise = (async () => {
        try {
          const cached = await Promise.race([
            loadCachedProceduralGeosByKey(PARTNER_MESH_CACHE_KEY),
            new Promise((r) => setTimeout(() => r(null), 180)),
          ]);
          const partnerChar = PARTNER_CHAR_ID === 'tree'
            ? buildProceduralTree(cached, partnerFacialRig, true)
            : buildProceduralPpong(cached, partnerFacialRig, true);
          while (partnerPivot.children.length > 0) {
            partnerPivot.remove(partnerPivot.children[0]);
          }
          partnerPivot.position.set(0, 0, 0);
          partnerPivot.rotation.set(0, 0, 0);
          partnerPivot.scale.set(1, 1, 1);
          partnerPivot.add(partnerChar);
          partnerPivot.updateMatrixWorld(true);

          snapshotRestTransformsInto(partnerPivot, partnerProceduralNodes, partnerPivot);
          discoverRigBonesInto(partnerChar, partnerRigBones);
          partnerMixer = new THREE.AnimationMixer(partnerPivot);
          partnerReady = true;
          playPartnerAnimation('Idle', 1.0);
          console.info(`[Minipet3D:Partner:${PARTNER_CHAR_ID}] Dual-Hero Partner Rig Ready.`);
          return true;
        } catch (err) {
          console.warn('Partner rig init failed:', err);
          return false;
        }
      })();
      return partnerBuildPromise;
    }

    async function loadPpongModel() {
      const tryExternalGlb = new URLSearchParams(window.location.search).get('glb') === '1';
      if (tryExternalGlb) {
        try {
          const [{ GLTFLoader }, { DRACOLoader }] = await Promise.all([
            import('three/addons/loaders/GLTFLoader.js'),
            import('three/addons/loaders/DRACOLoader.js'),
          ]);
          GLTFLoaderRef = GLTFLoader;
          DRACOLoaderRef = DRACOLoader;
          const gltfLoader = new GLTFLoader();
          const dracoLoader = new DRACOLoader();
          gltfLoader.setDRACOLoader(dracoLoader);
          const candidateUrls = ['./ppong.glb', './assets/ppong.glb', './models/ppong.glb'];
          for (const url of candidateUrls) {
            try {
              const gltf = await new Promise((resolve, reject) => {
                gltfLoader.load(url, resolve, undefined, reject);
              });
              mountModel(gltf.scene, gltf.animations || [], false);
              console.info(`[Ppong3D] Loaded external GLB from ${url} (${(gltf.animations || []).length} clips).`);
              return;
            } catch (_err) {
              // Try next candidate path
            }
          }
        } catch (_err) {
          // Fallback to procedural character rig
        }
      }

      const cached = await Promise.race([
        loadCachedProceduralGeos(),
        new Promise((r) => setTimeout(() => r(null), 180)),
      ]);
      const proceduralCharacter = CHAR_ID === 'tree'
        ? buildProceduralTree(cached)
        : buildProceduralPpong(cached);
      mountModel(proceduralCharacter, [], true);
      console.info(cached
        ? `[Minipet3D:${CHAR_ID}] Mounted 25-Bone Rig from warm IndexedDB mesh cache.`
        : `[Minipet3D:${CHAR_ID}] Mounted Seamless 25-Bone Skinned Game Character Rig.`);
    }

    // =========================================================================
    // 13. Public JS Bridge API (Invoked from PyQt6 via page().runJavaScript)
    // =========================================================================
    function normalizeActionName(rawName) {
      if (!rawName || typeof rawName !== 'string') return 'Idle';
      const cleaned = rawName.trim().toLowerCase().replace(/[\s_-]+/g, '');
      for (const canonical of CANONICAL_ACTIONS) {
        if (canonical.toLowerCase() === cleaned) return canonical;
      }
      if (cleaned.includes('spin') || cleaned.includes('twirl')) return 'HappySpin';
      if (cleaned.includes('dance') || cleaned.includes('groove')) return 'Dance';
      if (cleaned.includes('stretch') || cleaned.includes('yawn')) return 'Stretch';
      if (cleaned.includes('curious') || cleaned.includes('tilt') || cleaned.includes('inspect')) return 'Curious';
      if (cleaned.includes('sit') || cleaned.includes('rest')) return 'Sit';
      if (cleaned.includes('poke') || cleaned.includes('boop')) return 'Poke';
      if (cleaned.includes('pet') || cleaned.includes('stroke') || cleaned.includes('pat')) return 'Pet';
      if (cleaned.includes('land') || cleaned.includes('drop')) return 'DropLand';
      if (cleaned.includes('sleep') || cleaned.includes('drowsy') || cleaned.includes('doze') || cleaned.includes('nap')) return 'Sleepy';
      if (cleaned.includes('shy') || cleaned.includes('bashful') || cleaned.includes('blush')) return 'Shy';
      if (cleaned.includes('pout') || cleaned.includes('grumpy') || cleaned.includes('stomp') || cleaned.includes('sulky')) return 'Pout';
      if (cleaned.includes('love') || cleaned.includes('heart') || cleaned.includes('adore')) return 'Love';
      if (cleaned.includes('sad') || cleaned.includes('cry') || cleaned.includes('sniffle')) return 'Sad';
      if (cleaned.includes('proud') || cleaned.includes('confident') || cleaned.includes('victory')) return 'Proud';
      if (cleaned.includes('snack') || cleaned.includes('eat') || cleaned.includes('munch') || cleaned.includes('feed')) return 'Snack';
      if (cleaned.includes('run') || cleaned.includes('trot') || cleaned.includes('dash') || cleaned.includes('sprint')) return 'Run';
      if (cleaned.includes('jump') || cleaned.includes('cheer') || cleaned.includes('happy')) return 'Jump';
      if (cleaned.includes('wave') || cleaned.includes('greet') || cleaned.includes('hello')) return 'Wave';
      if (cleaned.includes('walk') || cleaned.includes('move') || cleaned.includes('stroll')) return 'Walk';
      if (cleaned.includes('talk') || cleaned.includes('speak') || cleaned.includes('chat')) return 'Talk';
      return 'Idle';
    }

    function setExpression(exprName, durationMs = 0) {
      facialRig.expressionOverride = exprName ? String(exprName).toLowerCase() : null;
      facialRig.expressionTimer = durationMs > 0 ? durationMs / 1000 : 0;
      if (exprName) {
        spawnEmotionEmotes(exprName);
      }
    }

    function setSpeechDuration(durationMs = 0) {
      facialRig.speechRemainingSec = Math.max(0, (Number(durationMs) || 0) / 1000);
    }

    function playAnimation(actionName, options = {}) {
      if (!mixer) return false;
      const targetName = normalizeActionName(actionName);
      const nextAction = ensureAction(targetName);
      if (!nextAction) return false;

      const defaultFade = (targetName === 'Idle' || targetName === 'Walk' || targetName === 'Run')
        ? 0.18
        : (targetName === 'DropLand' || targetName === 'Poke') ? 0.12 : 0.26;
      const fadeDuration = typeof options.fadeDuration === 'number' ? options.fadeDuration : defaultFade;

      if (actionRevertTimer) {
        clearTimeout(actionRevertTimer);
        actionRevertTimer = null;
      }

      if (typeof options.speechMs === 'number' && options.speechMs > 0) {
        facialRig.speechRemainingSec = options.speechMs / 1000;
      }

      // Secondary spring impulses & celebratory sparkles per game action
      if (targetName === 'Jump') {
        spawnSparkles(16, 1.55);
        springs.earLeftPitch.impulse(-3.0);
        springs.earRightPitch.impulse(-2.8);
        springs.tailPitch.impulse(4.0);
      } else if (targetName === 'HappySpin') {
        spawnSparkles(22, 1.48);
        springs.earLeftPitch.impulse(-2.6);
        springs.earRightPitch.impulse(-2.6);
        springs.tailYaw1.impulse(5.0);
      } else if (targetName === 'Wave') {
        spawnSparkles(10, 1.38);
        springs.earRightPitch.impulse(2.4);
      } else if (targetName === 'Dance') {
        spawnSparkles(14, 1.35);
        springs.tailYaw1.impulse(3.2);
      } else if (targetName === 'Poke') {
        spawnSparkles(12, 1.30);
        springs.landingSquash.impulse(-1.6);
        springs.earLeftPitch.impulse(3.4);
        springs.earRightPitch.impulse(3.2);
      } else if (targetName === 'DropLand') {
        spawnSparkles(10, 0.22);
        springs.landingSquash.impulse(-2.4);
        springs.earLeftPitch.impulse(3.6);
        springs.earRightPitch.impulse(3.4);
        springs.hornPitch.impulse(2.4);
      } else if (targetName === 'Curious') {
        springs.earLeftPitch.impulse(2.2);
      } else if (targetName === 'Stretch') {
        spawnSparkles(8, 1.45);
      }

      if (options.emotion) {
        setExpression(options.emotion, options.durationMs || options.speechMs || 3800);
      }

      const targetTimeScale = (targetName === 'Walk' || targetName === 'Run') ? locoTimeScale : 1.0;

      if (nextAction === currentAction) {
        nextAction.setEffectiveTimeScale(targetTimeScale);
        if (!LOOPING_ACTIONS.has(targetName)) {
          nextAction.reset().play();
        }
      } else {
        nextAction.enabled = true;
        nextAction.setEffectiveTimeScale(targetTimeScale);
        nextAction.setEffectiveWeight(1.0);
        nextAction.reset();
        nextAction.play();

        if (currentAction) {
          currentAction.crossFadeTo(nextAction, fadeDuration, false);
        }
        currentAction = nextAction;
        currentActionName = targetName;
      }

      if (LOOPING_ACTIONS.has(targetName) && targetName !== 'Idle' && targetName !== 'Walk' && targetName !== 'Run') {
        const revertMs = Number(options.durationMs) || 0;
        if (revertMs > 0) {
          actionRevertTimer = setTimeout(() => {
            if (currentActionName === targetName) {
              playAnimation('Idle', { fadeDuration: 0.34 });
            }
          }, revertMs);
        }
      }

      return true;
    }

    function setFacingDirection(dir) {
      facingDirection = Math.max(-1, Math.min(1, Number(dir) || 0));
    }

    function setStageYawOverride(radOrNull, snap = false) {
      const nextYaw = (typeof radOrNull === 'number' && Number.isFinite(radOrNull)) ? radOrNull : null;
      const wasNull = (stageYawOverride === null);
      stageYawOverride = nextYaw;
      if (nextYaw !== null && (snap || wasNull)) {
        currentFacingYaw = Math.atan2(Math.sin(nextYaw), Math.cos(nextYaw));
        prevFacingYaw = currentFacingYaw;
        stageGroup.rotation.y = currentFacingYaw;
      }
    }

    function updateCursorTarget(nx, ny) {
      cursorTarget.x = Math.max(-1, Math.min(1, Number(nx) || 0));
      cursorTarget.y = Math.max(-1, Math.min(1, Number(ny) || 0));
    }

    function setDragState(isDragging, vx = 0, vy = 0) {
      dragState.active = !!isDragging;
      dragState.vx = Math.max(-1.5, Math.min(1.5, Number(vx) || 0));
      dragState.vy = Math.max(-1.5, Math.min(1.5, Number(vy) || 0));
      if (dragState.active) {
        fallState.active = false;
      }
    }

    function setFallingState(isFalling, vy = 0) {
      fallState.active = !!isFalling;
      fallState.vy = Math.max(-2.5, Math.min(2.5, Number(vy) || 0));
    }

    function setPettingState(isPetting) {
      const next = !!isPetting;
      if (next === petState.active) return;
      petState.active = next;
      if (next) {
        spawnSparkles(10, 1.52);
        playAnimation('Pet', { fadeDuration: 0.20, emotion: 'happy' });
      } else if (currentActionName === 'Pet') {
        playAnimation('Idle', { fadeDuration: 0.30 });
      }
    }

    function triggerPokeReaction(zone = 'belly') {
      const z = String(zone || 'belly').toLowerCase();
      if (z === 'horn') {
        playAnimation('HappySpin', { fadeDuration: 0.16, emotion: 'excited' });
      } else if (z === 'face' || z === 'head') {
        playAnimation('Poke', { fadeDuration: 0.14, emotion: 'surprised' });
      } else {
        playAnimation('Jump', { fadeDuration: 0.16, emotion: 'excited' });
      }
      return true;
    }

    function setGazeAttentionWeight(weight = 1.0) {
      gazeState.attentionWeight = Math.max(0.0, Math.min(1.0, Number(weight) || 0.0));
    }

    let userScaleFactor = 0.10;
    let actionZoomMult = 1.0;
    function setScaleFactor(scale = 0.10) {
      userScaleFactor = Math.max(0.10, Math.min(2.5, Number(scale) || 0.10));
      const inCombat = Boolean(worldRpgSys && worldRpgSys.isCombatActive());
      if (!inCombat) {
        const eff = userScaleFactor * actionZoomMult;
        stageGroup.scale.setScalar(eff);
        shadowPlane.scale.setScalar(eff);
        if (meadowStripMesh) meadowStripMesh.scale.setScalar(eff);
      }
    }

    function setMeadowTrailEnabled(enabled = true) {
      stepDetector.trailEnabled = !!enabled;
      meadowUniforms.uVisible.value = enabled ? 1.0 : 0.0;
      if (!enabled) clearFootprintsAndGrass();
    }

    function triggerEmotionEmote(emotionName) {
      spawnEmotionEmotes(emotionName);
    }

    function setSpiderSwingState(active, progress = 0, dir = 1, ropeAngleRad = 0, phase = 'swing') {
      spiderSwingState.active = !!active;
      spiderSwingState.t = Math.max(0, Math.min(1, Number(progress) || 0));
      spiderSwingState.dir = dir >= 0 ? 1 : -1;
      spiderSwingState.ropeAngle = Number.isFinite(Number(ropeAngleRad)) ? Number(ropeAngleRad) : 0;
      spiderSwingState.phase = String(phase || 'swing');
      rainbowWebLine.visible = false;
      webAnchorMesh.visible = false;
      if (!active) {
        stageGroup.rotation.z = 0;
      }
    }

    function setWindowHeistState(active, targetTitle = '') {
      windowHeistState.active = !!active;
      windowHeistGroup.visible = false;
    }

    function setPeekState(active, depth = 1.0) {
      peekState.active = !!active;
      peekState.depth = Math.max(0, Math.min(1, Number(depth) || 0));
      if (!active) {
        characterPivot.position.y = 0;
      }
    }

    function setMagicDoodleState(active, shape = 'fireworks', progress = 1.0) {
      magicDoodleState.active = !!active;
      magicDoodleState.shape = shape;
      magicDoodleState.progress = Math.max(0, Math.min(1, Number(progress) || 0));
      if (active) {
        magicDoodleState.lingerTime = 5.0;
        magicDoodleGroup.visible = true;
        buildDoodleShapeVertices(shape, magicDoodleState.progress);
        if (shape === 'fireworks' && Math.random() < 0.45) {
          spawnSparkles(4, 1.55);
        }
      } else {
        magicDoodleGroup.visible = false;
        magicDoodleState.lingerTime = 0;
      }
    }

    function setSupermanFlyState(active, progress = 0, mode = 0) {
      supermanFlyState.active = !!active;
      supermanFlyState.progress = Number(progress) || 0;
      supermanFlyState.mode = Number(mode) || 0;
      if (typeof stolenPointerMesh !== 'undefined' && stolenPointerMesh) {
        stolenPointerMesh.visible = (active && supermanFlyState.mode === 1);
      }
      if (typeof stolenFolderMesh !== 'undefined' && stolenFolderMesh) {
        stolenFolderMesh.visible = (active && supermanFlyState.mode === 2);
      }
      if (!active) {
        stageGroup.rotation.x = 0;
        characterPivot.rotation.set(0, 0, 0);
        stageGroup.position.y = 0;
        if (typeof stolenPointerMesh !== 'undefined' && stolenPointerMesh) stolenPointerMesh.visible = false;
        if (typeof stolenFolderMesh !== 'undefined' && stolenFolderMesh) stolenFolderMesh.visible = false;
      }
    }

    window.setSpiderSwingState = setSpiderSwingState;
    window.setWindowHeistState = setWindowHeistState;
    window.setPeekState = setPeekState;
    window.setMagicDoodleState = setMagicDoodleState;
    window.setSupermanFlyState = setSupermanFlyState;

    window.setGazeAttentionWeight = setGazeAttentionWeight;

    function applyLayeredGazeAndSpringPhysics(dt, elapsed) {
