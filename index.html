<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ppong-ppong-i 3D Viewport</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }

    #status-badge {
      position: fixed;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #cbd5e1;
      font-size: 10px;
      letter-spacing: 0.2px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #status-badge.visible {
      opacity: 1;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="status-badge"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
    import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { createSoloPlaySubsystem } from './solo_play.js';
    import { createWorldRPGDefenseSubsystem } from './world_rpg_defense.js';

    window.emitPpongSync = function emitPpongSync(payload) {
      try {
        console.info('__PPONG_SYNC__:' + JSON.stringify(payload));
      } catch (_err) {}
    };

    // =========================================================================
    // 1. Renderer, Studio Telephoto Camera & Designer Soft-Vinyl Lighting
    // =========================================================================
    const container = document.getElementById('canvas-container');
    const statusBadge = document.getElementById('status-badge');

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance',
      premultipliedAlpha: false
    });
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Gentle studio IBL reflections (controlled intensity for matte-satin Sofubi vinyl)
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const envTexture = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environment = envTexture;
    if ('environmentIntensity' in scene) {
      scene.environmentIntensity = 0.26;
    }

    // Telephoto studio FOV (27 deg) with ample padding to prevent any clipping in all dynamic poses
    const camera = new THREE.PerspectiveCamera(
      27,
      window.innerWidth / Math.max(1, window.innerHeight),
      0.1,
      50
    );
    camera.position.set(0, 1.18, 7.6);
    camera.lookAt(0, 1.05, 0);

    const hemiLight = new THREE.HemisphereLight(0xfffcf8, 0xd8dee9, 1.35);
    hemiLight.position.set(0, 6, 0);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff8f0, 1.45);
    keyLight.position.set(2.4, 4.6, 5.2);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffe8dc, 0.52);
    fillLight.position.set(-3.2, 2.0, 3.6);
    scene.add(fillLight);

    const backRimLight = new THREE.DirectionalLight(0xe0f2fe, 0.68);
    backRimLight.position.set(-2.2, 3.8, -4.2);
    scene.add(backRimLight);

    // =========================================================================
    // 2. Custom Dual-Foot + Body Gaussian Soft Contact Shadow Plane
    // =========================================================================
    const contactShadowUniforms = {
      uLeftFoot: { value: new THREE.Vector2(-0.20, 0.02) },
      uRightFoot: { value: new THREE.Vector2(0.20, 0.02) },
      uBodyCenter: { value: new THREE.Vector2(0.0, 0.0) },
      uLeftLift: { value: 0.0 },
      uRightLift: { value: 0.0 },
      uBodyLift: { value: 0.0 }
    };

    const contactShadowMat = new THREE.ShaderMaterial({
      uniforms: contactShadowUniforms,
      transparent: true,
      depthWrite: false,
      vertexShader: /* glsl */ `
        varying vec2 vWorldXZ;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldXZ = wp.xz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform vec2 uLeftFoot;
        uniform vec2 uRightFoot;
        uniform vec2 uBodyCenter;
        uniform float uLeftLift;
        uniform float uRightLift;
        uniform float uBodyLift;
        varying vec2 vWorldXZ;

        float footBlob(vec2 p, vec2 c, float lift) {
          vec2 d = (p - c) / vec2(0.20 + lift * 0.18, 0.15 + lift * 0.14);
          float atten = 1.0 / (1.0 + lift * 3.2);
          return exp(-dot(d, d) * 2.1) * 0.24 * atten;
        }

        void main() {
          vec2 db = (vWorldXZ - uBodyCenter) / vec2(0.48 + uBodyLift * 0.30, 0.34 + uBodyLift * 0.22);
          float bodyBroad = exp(-dot(db, db) * 1.65) * (0.20 / (1.0 + uBodyLift * 2.2));
          float lf = footBlob(vWorldXZ, uLeftFoot, uLeftLift);
          float rf = footBlob(vWorldXZ, uRightFoot, uRightLift);

          // Edge fade ensures zero circular clipping artifact
          float edgeDist = length(vWorldXZ) / 1.35;
          float edgeMask = 1.0 - smoothstep(0.72, 1.0, edgeDist);
          float alpha = clamp((bodyBroad + lf + rf) * edgeMask, 0.0, 0.34);
          gl_FragColor = vec4(0.07, 0.10, 0.16, alpha);
        }
      `
    });

    const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 2.8), contactShadowMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0.002;
    shadowPlane.renderOrder = 1;
    scene.add(shadowPlane);

    // =========================================================================
    // 3. Soft-Vinyl Half-Lambert SSS + Fresnel Sheen Shader Factory
    // =========================================================================
    function createSoftVinylMaterial({
      color = 0xffffff,
      roughness = 0.72,
      sssColor = 0xffe4d6,
      sssStrength = 0.18,
      rimColor = 0xffffff,
      rimStrength = 0.16,
      vertexColors = false
    }) {
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness: 0.0,
        envMapIntensity: 0.24,
        vertexColors
      });

      const uSssCol = new THREE.Color(sssColor);
      const uRimCol = new THREE.Color(rimColor);

      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uSssColor = { value: uSssCol };
        shader.uniforms.uSssStrength = { value: sssStrength };
        shader.uniforms.uRimColor = { value: uRimCol };
        shader.uniforms.uRimStrength = { value: rimStrength };

        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <common>',
          `#include <common>
           uniform vec3 uSssColor;
           uniform float uSssStrength;
           uniform vec3 uRimColor;
           uniform float uRimStrength;`
        );

        shader.fragmentShader = shader.fragmentShader.replace(
          '#include <dithering_fragment>',
          `
          vec3 viewDirNorm = normalize(vViewPosition);
          vec3 keyDirView = normalize(vec3(0.42, 0.68, 0.60));
          float ndl = dot(normal, keyDirView);
          // Warm subsurface scattering wrap across shadow terminator
          float sssBand = smoothstep(-0.65, 0.35, ndl) * (1.0 - smoothstep(0.05, 0.75, ndl));
          gl_FragColor.rgb += uSssColor * (sssBand * uSssStrength + 0.035 * uSssStrength);

          // View-space silky Fresnel sheen for desktop contrast on both light & dark wallpapers
          float fresnel = pow(1.0 - clamp(dot(normal, viewDirNorm), 0.0, 1.0), 3.1);
          gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb + uRimColor * uRimStrength, fresnel);
          #include <dithering_fragment>
          `
        );
      };
      return mat;
    }

    // =========================================================================
    // 4. 4-Pointed Twinkle Starburst Sparkles (toneMapped: false)
    // =========================================================================
    function createStarburstGeometry() {
      const shape = new THREE.Shape();
      const spikes = 4;
      const outerR = 0.068;
      const innerR = 0.018;
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const a = (i / (spikes * 2)) * Math.PI * 2;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.012,
        bevelEnabled: true,
        bevelThickness: 0.008,
        bevelSize: 0.006,
        bevelSegments: 2
      });
      geo.center();
      return geo;
    }

    const sparkleGeo = createStarburstGeometry();
    const sparklePalette = [0xff5964, 0xff9f1c, 0xffe74c, 0x4cd964, 0x38bdf8, 0xc084fc, 0xff7eb6];
    const sparkles = [];

    function spawnSparkles(count = 12, originY = 1.35) {
      for (let i = 0; i < count; i++) {
        const color = sparklePalette[i % sparklePalette.length];
        const mat = new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 1.0,
          toneMapped: false
        });
        const mesh = new THREE.Mesh(sparkleGeo, mat);
        const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        const radius = 0.42 + Math.random() * 0.36;
        mesh.position.set(
          Math.cos(angle) * radius,
          originY + (Math.random() - 0.3) * 0.65,
          Math.sin(angle) * radius * 0.45 + 0.15
        );
        const baseScale = 0.65 + Math.random() * 0.65;
        mesh.scale.setScalar(0.01);
        scene.add(mesh);
        sparkles.push({
          mesh,
          baseScale,
          vx: Math.cos(angle) * (0.28 + Math.random() * 0.35),
          vy: 0.55 + Math.random() * 0.65,
          vz: Math.sin(angle) * 0.18,
          spin: (Math.random() - 0.5) * 5.0,
          phase: Math.random() * Math.PI * 2,
          life: 0,
          maxLife: 0.78 + Math.random() * 0.42
        });
      }
    }

    function clearSparkles() {
      while (sparkles.length > 0) {
        const s = sparkles.pop();
        scene.remove(s.mesh);
        s.mesh.material.dispose();
      }
    }

    function updateSparkles(dt) {
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const s = sparkles[i];
        s.life += dt;
        const u = s.life / s.maxLife;
        if (u >= 1) {
          scene.remove(s.mesh);
          s.mesh.material.dispose();
          sparkles.splice(i, 1);
          continue;
        }
        s.mesh.position.x += s.vx * dt;
        s.mesh.position.y += s.vy * dt;
        s.mesh.position.z += s.vz * dt;
        s.vy -= 0.72 * dt;
        s.mesh.rotation.z += s.spin * dt;
        // Gentle face-on wobble (prevents 90-deg edge-on vertical tick artifact!)
        s.mesh.rotation.y = Math.sin(s.life * 4.2 + s.phase) * 0.32;

        // Elastic pop-in + twinkle pulse + smooth fade-out
        const pop = u < 0.18 ? (u / 0.18) : 1.0;
        const twinkle = 0.82 + 0.26 * Math.sin(s.life * 22.0 + s.phase);
        const fade = 1.0 - Math.pow(u, 1.8);
        s.mesh.scale.setScalar(s.baseScale * pop * twinkle * (0.55 + 0.45 * fade));
        s.mesh.material.opacity = fade;
      }
    }

    // =========================================================================
    // 4B. Meadow Grass Strip, 2.5s Fading Paw Footprints, Grass Tuft Particles & 3D Emotion Emotes
    // =========================================================================
    const meadowUniforms = {
      uTime: { value: 0.0 },
      uLeftFoot: { value: new THREE.Vector3(-0.20, 0.02, 1.0) },
      uRightFoot: { value: new THREE.Vector3(0.20, 0.02, 1.0) },
      uVisible: { value: 1.0 },
      uWorldviewMode: { value: 0.0 } // 0=fantasy, 1=cyberpunk, 2=scifi, 3=cozy
    };

    const meadowStripMat = new THREE.ShaderMaterial({
      uniforms: meadowUniforms,
      transparent: true,
      depthWrite: false,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        varying vec2 vWorldXZ;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldXZ = wp.xz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uTime;
        uniform vec3 uLeftFoot;
        uniform vec3 uRightFoot;
        uniform float uVisible;
        uniform float uWorldviewMode;
        varying vec2 vUv;
        varying vec2 vWorldXZ;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        void main() {
          if (uVisible <= 0.01) discard;
          vec2 p = vUv * 2.0 - 1.0;
          float rad = length(p / vec2(0.95, 0.72));
          if (rad >= 1.0) discard;

          // Foot depression darkens & flattens grass directly under paws
          float dL = length((vWorldXZ - uLeftFoot.xy) / vec2(0.18, 0.14));
          float dR = length((vWorldXZ - uRightFoot.xy) / vec2(0.18, 0.14));
          float press = max(
            exp(-dL * dL * 2.4) * uLeftFoot.z,
            exp(-dR * dR * 2.4) * uRightFoot.z
          );

          // Procedural swaying meadow grass blades & clover speckles
          float sway = sin(uTime * 2.6 + vWorldXZ.x * 9.0) * 0.035 * (1.0 - press * 0.7);
          vec2 grassCoord = vec2((vWorldXZ.x + sway) * 28.0, vWorldXZ.y * 22.0);
          float bladeNoise = sin(grassCoord.x) * cos(grassCoord.y * 0.8 + sin(grassCoord.x * 0.5));
          float micro = hash21(floor(grassCoord * 1.8));

          vec3 baseGreen = vec3(0.24, 0.68, 0.34);
          vec3 tipGreen  = vec3(0.48, 0.86, 0.42);
          vec3 deepMoss  = vec3(0.13, 0.44, 0.22);

          if (uWorldviewMode > 0.5 && uWorldviewMode < 1.5) {
            // Cyberpunk Neon Grid
            baseGreen = vec3(0.06, 0.09, 0.22);
            tipGreen  = vec3(0.13, 0.83, 0.93);
            deepMoss  = vec3(0.95, 0.25, 0.37);
          } else if (uWorldviewMode >= 1.5 && uWorldviewMode < 2.5) {
            // Space Odyssey Lunar/Mars Deck
            baseGreen = vec3(0.18, 0.20, 0.36);
            tipGreen  = vec3(0.50, 0.55, 0.97);
            deepMoss  = vec3(0.09, 0.10, 0.20);
          } else if (uWorldviewMode >= 2.5) {
            // Cozy Golden Clover Island
            baseGreen = vec3(0.32, 0.74, 0.38);
            tipGreen  = vec3(0.98, 0.88, 0.42);
            deepMoss  = vec3(0.18, 0.52, 0.28);
          }

          vec3 col = mix(baseGreen, tipGreen, smoothstep(-0.4, 0.7, bladeNoise));
          col = mix(col, deepMoss, press * 0.55);

          // Tiny pastel meadow flower / neon / star dots
          if (micro > 0.965) {
            col = mix(col, vec3(1.0, 0.94, 0.48), 0.75);
          } else if (micro < 0.025) {
            col = mix(col, vec3(0.98, 0.99, 1.0), 0.65);
          }

          float rimFade = (1.0 - smoothstep(0.45, 0.98, rad));
          float bladeEdge = smoothstep(0.98, 0.62, rad + 0.08 * bladeNoise);
          float alpha = clamp(rimFade * bladeEdge * 0.54 * uVisible, 0.0, 0.62);
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const meadowStripMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 0.95), meadowStripMat);
    meadowStripMesh.rotation.x = -Math.PI / 2;
    meadowStripMesh.position.y = 0.006;
    meadowStripMesh.renderOrder = 2;
    scene.add(meadowStripMesh);

    // 2.5-Second Fading Paw-Pad Footprints (Main Cushion + 3 Toe Beans)
    const pawFootprintMatTemplate = new THREE.ShaderMaterial({
      uniforms: {
        uOpacity: { value: 0.78 },
        uTint: { value: new THREE.Color(0x22543d) },
        uGlow: { value: new THREE.Color(0x86efac) }
      },
      transparent: true,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      vertexShader: /* glsl */ `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: /* glsl */ `
        uniform float uOpacity;
        uniform vec3 uTint;
        uniform vec3 uGlow;
        varying vec2 vUv;

        float sdEllipse(vec2 p, vec2 r) {
          return length(p / r) - 1.0;
        }

        void main() {
          vec2 p = vUv * 2.0 - 1.0;
          // Main heart-ish palm pad
          float mainPad = sdEllipse(p - vec2(0.0, -0.18), vec2(0.44, 0.34));
          // 3 cute toe beans above
          float toeL = sdEllipse(p - vec2(-0.36, 0.34), vec2(0.17, 0.21));
          float toeM = sdEllipse(p - vec2(0.0,   0.46), vec2(0.18, 0.23));
          float toeR = sdEllipse(p - vec2(0.36,  0.34), vec2(0.17, 0.21));

          float d = min(min(mainPad, toeL), min(toeM, toeR));
          float mask = 1.0 - smoothstep(-0.06, 0.08, d);
          float rim = exp(-pow(d / 0.14, 2.0)) * 0.55;
          float alpha = clamp((mask * 0.78 + rim * 0.35) * uOpacity, 0.0, 0.85);
          if (alpha <= 0.004) discard;

          vec3 col = mix(uTint, uGlow, rim);
          gl_FragColor = vec4(col, alpha);
        }
      `
    });

    const pawFootprintGeo = new THREE.PlaneGeometry(0.22, 0.24);
    const activeFootprints = [];
    const grassBlades = [];
    const stepDetector = {
      leftWasDown: true,
      rightWasDown: true,
      leftCooldown: 0,
      rightCooldown: 0,
      trailEnabled: true,
      worldScrollVx: 0
    };

    function spawnFootprint(worldX, worldZ, side = 1, yaw = 0) {
      if (!stepDetector.trailEnabled) return;
      const mat = pawFootprintMatTemplate.clone();
      mat.uniforms.uOpacity.value = 0.82;
      mat.uniforms.uTint.value.setHex(side < 0 ? 0x1e4e3a : 0x22543d);
      mat.uniforms.uGlow.value.setHex(0x86efac);

      const mesh = new THREE.Mesh(pawFootprintGeo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.rotation.z = -yaw * 0.35 + (side * -0.10);
      mesh.position.set(worldX, shadowPlane.position.y + 0.004, worldZ + 0.02);
      scene.add(mesh);

      activeFootprints.push({
        mesh,
        life: 0,
        maxLife: 2.55, // Fades smoothly over 2.55 seconds (2~3s requested!)
        baseScale: 1.0
      });

      while (activeFootprints.length > 26) {
        const oldest = activeFootprints.shift();
        scene.remove(oldest.mesh);
        oldest.mesh.material.dispose();
      }
    }

    const grassBladeGeo = new THREE.ConeGeometry(0.018, 0.085, 4);
    const grassColors = [0x4ade80, 0x22c55e, 0x86efac, 0xa3e635, 0xfef08a];

    function spawnGrassTuftBurst(worldX, worldY, worldZ, count = 5) {
      if (!stepDetector.trailEnabled) return;
      for (let i = 0; i < count; i++) {
        const col = grassColors[i % grassColors.length];
        const mat = new THREE.MeshBasicMaterial({
          color: col,
          transparent: true,
          opacity: 0.95,
          toneMapped: false
        });
        const mesh = new THREE.Mesh(grassBladeGeo, mat);
        const ang = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.6;
        const spd = 0.24 + Math.random() * 0.34;
        mesh.position.set(
          worldX + Math.cos(ang) * 0.05,
          worldY + 0.02,
          worldZ + Math.sin(ang) * 0.04 + 0.04
        );
        mesh.rotation.set(
          (Math.random() - 0.5) * 0.8,
          Math.random() * Math.PI,
          (Math.random() - 0.5) * 1.1
        );
        scene.add(mesh);
        grassBlades.push({
          mesh,
          vx: Math.cos(ang) * spd - facingDirection * 0.22,
          vy: 0.48 + Math.random() * 0.42,
          vz: Math.sin(ang) * spd * 0.5,
          rotZ: (Math.random() - 0.5) * 7.0,
          life: 0,
          maxLife: 0.52 + Math.random() * 0.26
        });
      }
    }

    function clearFootprintsAndGrass() {
      while (activeFootprints.length > 0) {
        const fp = activeFootprints.pop();
        scene.remove(fp.mesh);
        fp.mesh.material.dispose();
      }
      while (grassBlades.length > 0) {
        const gb = grassBlades.pop();
        scene.remove(gb.mesh);
        gb.mesh.material.dispose();
      }
    }

    function updateFootprintsAndGrass(dt, groundY) {
      // Scroll footprints opposite to walking direction so they stay planted on the ground!
      const scrollSpeed = (currentActionName === 'Run' ? 0.92 : (currentActionName === 'Walk' ? 0.45 : 0.0)) * (-facingDirection);
      for (let i = activeFootprints.length - 1; i >= 0; i--) {
        const fp = activeFootprints[i];
        fp.life += dt;
        const u = fp.life / fp.maxLife;
        if (u >= 1.0) {
          scene.remove(fp.mesh);
          fp.mesh.material.dispose();
          activeFootprints.splice(i, 1);
          continue;
        }
        fp.mesh.position.x += scrollSpeed * dt;
        fp.mesh.position.y = groundY + 0.004;
        // Hold crisp for first 1.2s, then smooth fade out to 2.55s
        const fade = u < 0.45 ? 1.0 : (1.0 - smoothstep(0.45, 1.0, u));
        fp.mesh.material.uniforms.uOpacity.value = 0.82 * fade;
        const s = 0.85 + 0.18 * smoothstep(0.0, 0.15, u);
        fp.mesh.scale.setScalar(s);
      }

      for (let i = grassBlades.length - 1; i >= 0; i--) {
        const gb = grassBlades[i];
        gb.life += dt;

    // =========================================================================
    // 5. Analytical SDF + MarchingCubes + Taubin Smoother + Auto-Skinner
    // =========================================================================
    function smin(a, b, k) {
      const h = Math.max(k - Math.abs(a - b), 0.0) / k;
      return Math.min(a, b) - h * h * k * 0.25;
    }

    function smax(a, b, k) {
      return -smin(-a, -b, k);
    }

    function smoothstep(e0, e1, x) {
      const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
      return t * t * (3 - 2 * t);
    }

    function sdSphere(px, py, pz, cx, cy, cz, r) {
      const dx = px - cx, dy = py - cy, dz = pz - cz;
      return Math.sqrt(dx * dx + dy * dy + dz * dz) - r;
    }

    function sdEllipsoid(px, py, pz, cx, cy, cz, rx, ry, rz) {
      const dx = (px - cx) / rx, dy = (py - cy) / ry, dz = (pz - cz) / rz;
      const k0 = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (k0 < 1e-6) return -Math.min(rx, ry, rz);
      const dx2 = (px - cx) / (rx * rx), dy2 = (py - cy) / (ry * ry), dz2 = (pz - cz) / (rz * rz);
      const k1 = Math.sqrt(dx2 * dx2 + dy2 * dy2 + dz2 * dz2);
      return (k0 * (k0 - 1.0)) / k1;
    }

    function sdCapsule(px, py, pz, ax, ay, az, bx, by, bz, ra, rb) {
      const pax = px - ax, pay = py - ay, paz = pz - az;
      const bax = bx - ax, bay = by - ay, baz = bz - az;
      const baba = bax * bax + bay * bay + baz * baz;
      const h = Math.max(0.0, Math.min(1.0, (pax * bax + pay * bay + paz * baz) / baba));
      const dx = pax - bax * h, dy = pay - bay * h, dz = paz - baz * h;
      return Math.sqrt(dx * dx + dy * dy + dz * dz) - (ra + (rb - ra) * h);
    }

    function sdTorusY(px, py, pz, cx, cy, cz, majorR, minorR) {
      const dx = px - cx, dy = py - cy, dz = pz - cz;
      const qx = Math.sqrt(dx * dx + dz * dz) - majorR;
      return Math.sqrt(qx * qx + dy * dy) - minorR;
    }

    function buildSmoothedSdfGeometry(sdfFn, bounds, res = 62, taubinPasses = 5) {
      const [minX, minY, minZ, maxX, maxY, maxZ] = bounds;
      const spanX = maxX - minX, spanY = maxY - minY, spanZ = maxZ - minZ;

      const mc = new MarchingCubes(res, new THREE.MeshBasicMaterial(), false, false, 140000);
      mc.isolation = 0.0;
      const field = mc.field;

      let idx = 0;
      for (let k = 0; k < res; k++) {
        const z = minZ + (k / (res - 1)) * spanZ;
        for (let j = 0; j < res; j++) {
          const y = minY + (j / (res - 1)) * spanY;
          for (let i = 0; i < res; i++) {
            const x = minX + (i / (res - 1)) * spanX;
            field[idx++] = -sdfFn(x, y, z);
          }
        }
      }

      mc.update();
      const usedPos = mc.positionArray.slice(0, mc.count * 3);
      const rawGeo = new THREE.BufferGeometry();
      rawGeo.setAttribute('position', new THREE.BufferAttribute(usedPos, 3));

      const geo = mergeVertices(rawGeo, 1e-4);
      rawGeo.dispose();

      const posAttr = geo.attributes.position;
      const vCount = posAttr.count;

      for (let v = 0; v < vCount; v++) {
        const ux = ((posAttr.getX(v) + 1.0) * 0.5 * res) / (res - 1);
        const uy = ((posAttr.getY(v) + 1.0) * 0.5 * res) / (res - 1);
        const uz = ((posAttr.getZ(v) + 1.0) * 0.5 * res) / (res - 1);
        posAttr.setXYZ(v, minX + ux * spanX, minY + uy * spanY, minZ + uz * spanZ);
      }

      // Topological adjacency for volume-preserving Taubin (lambda/mu) mesh relaxation
      const indexAttr = geo.index;
      const adj = Array.from({ length: vCount }, () => new Set());
      for (let f = 0; f < indexAttr.count; f += 3) {
        const a = indexAttr.getX(f), b = indexAttr.getX(f + 1), c = indexAttr.getX(f + 2);
        adj[a].add(b); adj[a].add(c);
        adj[b].add(a); adj[b].add(c);
        adj[c].add(a); adj[c].add(b);
      }
      const neighbors = adj.map((s) => Int32Array.from(s));
      const cur = new Float32Array(posAttr.array);
      const next = new Float32Array(cur.length);

      const relax = (factor) => {
        for (let v = 0; v < vCount; v++) {
          const nb = neighbors[v];
          const nLen = nb.length;
          if (!nLen) continue;
          let ax = 0, ay = 0, az = 0;
          for (let k = 0; k < nLen; k++) {
            const o = nb[k] * 3;
            ax += cur[o]; ay += cur[o + 1]; az += cur[o + 2];
          }
          const inv = 1 / nLen;
          const vi = v * 3;
          next[vi] = cur[vi] + factor * (ax * inv - cur[vi]);
          next[vi + 1] = cur[vi + 1] + factor * (ay * inv - cur[vi + 1]);
          next[vi + 2] = cur[vi + 2] + factor * (az * inv - cur[vi + 2]);
        }
        cur.set(next);
      };

      for (let it = 0; it < taubinPasses; it++) {
        relax(0.46);
        relax(-0.485);
      }

      posAttr.array.set(cur);
      posAttr.needsUpdate = true;
      geo.computeVertexNormals();
      return geo;
    }

    function distPointToSegmentSq(px, py, pz, ax, ay, az, bx, by, bz) {
      const abx = bx - ax, aby = by - ay, abz = bz - az;
      const apx = px - ax, apy = py - ay, apz = pz - az;
      const lenSq = abx * abx + aby * aby + abz * abz;
      const t = lenSq > 1e-8 ? Math.max(0, Math.min(1, (apx * abx + apy * aby + apz * abz) / lenSq)) : 0;
      const dx = apx - abx * t, dy = apy - aby * t, dz = apz - abz * t;
      return dx * dx + dy * dy + dz * dz;
    }

    // Side-gated & Torso-Arm-gated Gaussian capsule skinning (zero cross-limb or chest-to-elbow bleed)
    function applyCapsuleSkinWeights(geo, capsules, torsoArmGate = false) {
      const pos = geo.attributes.position;
      const vCount = pos.count;
      const skinIndices = new Uint16Array(vCount * 4);
      const skinWeights = new Float32Array(vCount * 4);

      for (let v = 0; v < vCount; v++) {
        const vx = pos.getX(v), vy = pos.getY(v), vz = pos.getZ(v);
        const ax = Math.abs(vx);
        const hits = [];

        for (let c = 0; c < capsules.length; c++) {
          const cap = capsules[c];
          // Side-gate: left bones (-1) never pull right-side vertices and vice versa
          if (cap.side === -1 && vx > 0.025) continue;
          if (cap.side === 1 && vx < -0.025) continue;

          const d2 = distPointToSegmentSq(
            vx, vy, vz,
            cap.ax, cap.ay, cap.az,
            cap.bx, cap.by, cap.bz
          );
          let w = Math.exp(-d2 / (2.0 * cap.sigma * cap.sigma)) * (cap.bias || 1.0);

          // Prevent torso bones from dragging upper-arm / elbow / forearm vertices during full-range waves & stretches
          if (torsoArmGate && cap.isTorso && vy > 0.58) {
            const gate = 1.0 - smoothstep(0.20, 0.31, ax);
            w *= gate;
          }

          if (w > 1e-5) {
            hits.push({ boneIdx: cap.boneIdx, w });
          }
        }

        hits.sort((a, b) => b.w - a.w);
        const top = hits.slice(0, 4);
        let sum = 0;
        for (const h of top) sum += h.w;

        const base = v * 4;
        if (sum <= 1e-6) {
          skinIndices[base] = capsules[0].boneIdx;
          skinWeights[base] = 1.0;
        } else {
          for (let k = 0; k < 4; k++) {
            if (k < top.length) {
              skinIndices[base + k] = top[k].boneIdx;
              skinWeights[base + k] = top[k].w / sum;
            } else {
              skinIndices[base + k] = 0;
              skinWeights[base + k] = 0;
            }
          }
        }
      }

      geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(skinIndices, 4));
      geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(skinWeights, 4));
    }

    // =========================================================================
    // 6. Sculpted Ppong-ppong-i SDF Definitions & Surface Projection Helpers
    // =========================================================================
    // Seamless Convex Romper Body + Ball-Joint Neck Plug + -12 deg Gentle A-Pose Arms + Baby Paws
    function bodyRomperSdf(x, y, z) {
      const ax = Math.abs(x);

      // 3-tier smooth convex teardrop romper torso (eliminates hourglass waist pinch)
      const lowerBelly = sdEllipsoid(x, y, z, 0, 0.41, 0.034, 0.396, 0.258, 0.350);
      const glutes = sdEllipsoid(x, y, z, 0, 0.37, -0.046, 0.378, 0.238, 0.345);
      const midTorso = sdEllipsoid(x, y, z, 0, 0.565, 0.022, 0.368, 0.242, 0.322);
      const upperChest = sdEllipsoid(x, y, z, 0, 0.715, 0.012, 0.308, 0.225, 0.276);
      let d = smin(smin(smin(lowerBelly, glutes, 0.12), midTorso, 0.15), upperChest, 0.16);

      // Ball-joint upward neck plug + subtle collar rim (100% eliminates head-tilt neck gap!)
      const neckPlug = sdCapsule(x, y, z, 0, 0.78, 0.005, 0, 0.962, 0.005, 0.212, 0.152);
      d = smin(d, neckPlug, 0.035);
      const collarRim = sdTorusY(x, y, z, 0, 0.888, 0.006, 0.198, 0.018);
      d = smin(d, collarRim, 0.018);

      // Tapered baby romper legs + narrow soft U-arch crotch
      const leg = sdCapsule(ax, y, z, 0.184, 0.295, 0.0, 0.202, 0.066, 0.012, 0.172, 0.132);
      d = smin(d, leg, 0.072);

      const crotchArch = sdEllipsoid(x, y, z, 0, 0.096, 0.01, 0.046, 0.125, 0.24);
      d = smax(d, -crotchArch, 0.052);

      // Rounded cushion baby-paw soles resting solidly on y = 0 (eliminates flat-cut cylinder feet)
      d = smax(d, -y, 0.052);

      // -12 deg gentle low-horizontal A-pose bind arms: optimal midpoint between relaxed A-stance (-38 deg) & high cheer (+48 deg)!
      const upperArm = sdCapsule(ax, y, z, 0.225, 0.775, 0.010, 0.385, 0.742, 0.026, 0.108, 0.098);
      const foreArm = sdCapsule(ax, y, z, 0.385, 0.742, 0.026, 0.525, 0.710, 0.048, 0.098, 0.104);
      const armFull = smin(upperArm, foreArm, 0.028);

    // Solid Round Mochi Cat Head + Plump Snow-White Cat Ears + 3D 'ω' Muzzle Cushions
    function headSolidSdf(x, y, z) {

      const zScaled = z > 0 ? z / 0.90 : z / 1.04;

      const cranium = sdEllipsoid(x, y, zScaled, 0, 1.335, 0, 0.538, 0.455, 0.482);
      const mochiCheeks = sdEllipsoid(ax, y, zScaled, 0.175, 1.215, 0.035, 0.365, 0.248, 0.392);
      let d = smin(cranium, mochiCheeks, 0.16);

      // Cute 3D cat muzzle fullness + paired 'ω' whisker-pad cushions for 3/4 profile depth
      const muzzle = sdEllipsoid(x, y, z, 0, 1.210, 0.422, 0.142, 0.082, 0.048);
      const omegaPads = sdEllipsoid(ax, y, z, 0.056, 1.202, 0.432, 0.080, 0.050, 0.036);
      d = smin(smin(d, muzzle, 0.062), omegaPads, 0.045);

      // Softly rolled mochi chin/jaw underside (wraps smoothly over ball-joint neckPlug!)
      d = smax(d, -(y - 0.872), 0.088);

      // Prominent, clean convex cat ears harmonizing with outer cheek silhouette
      const earMain = sdCapsule(ax, y, z, 0.285, 1.545, -0.012, 0.436, 1.832, 0.008, 0.155, 0.050);
      const earOuterCurve = sdEllipsoid(ax, y, z, 0.368, 1.665, -0.008, 0.116, 0.138, 0.080);
      const ear = smin(earMain, earOuterCurve, 0.055);
      d = smin(d, ear, 0.072);

      return d;
    }

    // Full Sculpted Head SDF including subtle inner-ear cushion, eye sockets & shallow mouth pocket
    function headFullSdf(x, y, z) {
      const ax = Math.abs(x);
      let d = headSolidSdf(x, y, z);

      // Subtle plush inner-ear scoop (preserves thick pure snow-white ear rims!)
      const earConcha = sdCapsule(ax, y, z, 0.332, 1.645, 0.070, 0.402, 1.768, 0.054, 0.032, 0.012);

      const mouthPocket = sdEllipsoid(x, y, z, 0, 1.132, 0.462, 0.086, 0.054, 0.020);

    // 11-Lobe Crisp Fluffy Cumulus Popcorn Cloud Tail SDF (with deep romper-back socket lobe!)
    const CLOUD_LOBES = [
      [0.0, 0.375, -0.335, 0.118],
      [0.0, 0.38, -0.44, 0.154],
      [0.0, 0.41, -0.59, 0.170],
      [-0.168, 0.425, -0.54, 0.142],
      [0.168, 0.425, -0.54, 0.142],
      [-0.240, 0.355, -0.48, 0.120],

      [0.118, 0.282, -0.52, 0.120],
      [0.0, 0.40, -0.715, 0.132]
    ];

    function cloudTailSdf(x, y, z) {
      let d = 999;
      for (let i = 0; i < CLOUD_LOBES.length; i++) {
        const [cx, cy, cz, cr] = CLOUD_LOBES[i];
        const sd = sdSphere(x, y, z, cx, cy, cz, cr);
        d = i === 0 ? sd : smin(d, sd, 0.016);
      }
      return d;
    }

    // Newton ray-march onto headSolidSdf along -Z + exact central-difference surface normal
    function projectOntoFaceSurface(x, y) {
      let z = 0.65;
      for (let i = 0; i < 12; i++) {
        const dist = headSolidSdf(x, y, z);
        z -= dist * 0.92;
        if (Math.abs(dist) < 1e-5) break;
      }
      const eps = 0.002;
      const nx = headSolidSdf(x + eps, y, z) - headSolidSdf(x - eps, y, z);
      const ny = headSolidSdf(x, y + eps, z) - headSolidSdf(x, y - eps, z);
      const nz = headSolidSdf(x, y, z + eps) - headSolidSdf(x, y, z - eps);
      const n = new THREE.Vector3(nx, ny, nz).normalize();
      return { point: new THREE.Vector3(x, y, z), normal: n };
    }

    // =========================================================================
    // 7. Parametric Seam-Free 3-Flute Helical Spiral Rainbow Horn
    // =========================================================================
    function buildSpiralRainbowHornGeometry() {
      const radialSegs = 64;
      const heightSegs = 80;
      const hornH = 0.435;
      const baseR0 = 0.132;

      // Vivid turnaround rainbow stops (Lime base corner -> Sky Blue -> Emerald -> Sunny Yellow -> Tangerine -> Coral Red tip)
      const stops = [
        new THREE.Color(0x6fd432),
        new THREE.Color(0x149ee0),
        new THREE.Color(0x34c246),
        new THREE.Color(0xfcd11e),
        new THREE.Color(0xf67418),
        new THREE.Color(0xe32d22)
      ];

      function sampleRainbow(s) {
        const c = Math.max(0, Math.min(0.9999, s)) * (stops.length - 1);
        const i = Math.floor(c);
        // Crisp ribbon border between adjacent rainbow flutes (sRGB-aware curve)
        const f = smoothstep(0.28, 0.72, c - i);
        return stops[i].clone().lerp(stops[Math.min(stops.length - 1, i + 1)], f);
      }

      const positions = [];
      const colors = [];
      const indices = [];

      for (let iv = 0; iv <= heightSegs; iv++) {
        const v = iv / heightSegs;

        // Convex cone taper + root fillet skirt + smooth hemispherical dome tip
        let profileR;
        let y;
        if (v < 0.90) {
          const t = v / 0.90;
          profileR = baseR0 * Math.pow(1.0 - t * 0.80, 0.80) + 0.013 * Math.exp(-v * 30.0);
          y = v * hornH;
        } else {
          const u = (v - 0.90) / 0.10;
          const rAtJoin = baseR0 * Math.pow(0.20, 0.80);
          profileR = rAtJoin * Math.sqrt(Math.max(0, 1.0 - u * u));
          y = (0.90 + 0.10 * Math.sin(u * Math.PI * 0.5)) * hornH;
        }

        const fluteEnv = Math.sin(Math.PI * Math.min(1, v * 1.08)) * (1.0 - smoothstep(0.80, 0.97, v));

        for (let iu = 0; iu <= radialSegs; iu++) {
          const theta = (iu / radialSegs) * Math.PI * 2;
          // Diagonal upward-right ('/') helical flutes locked to color ribbon slope!
          const fluteWave = Math.cos(2.0 * theta + 8.8 * v);
          const r = profileR * (1.0 + 0.092 * fluteEnv * fluteWave);

          const x = Math.cos(theta) * r;
          const z = Math.sin(theta) * r;
          positions.push(x, y, z);

          // Seam-free 35-deg diagonal upward-right ('/') rainbow bands across front & back
          const spiralPhase = v * 0.83 - 0.175 * Math.cos(theta) + 0.165;
          const col = sampleRainbow(spiralPhase);
          const rootAo = 0.90 + 0.10 * smoothstep(0.0, 0.12, v);
          const grooveShade = 0.91 + 0.09 * fluteWave * fluteEnv;
          col.multiplyScalar(rootAo * grooveShade);
          colors.push(col.r, col.g, col.b);
        }
      }

      const stride = radialSegs + 1;
      for (let iv = 0; iv < heightSegs; iv++) {
        for (let iu = 0; iu < radialSegs; iu++) {
          const a = iv * stride + iu;
          const b = a + 1;
          const c = (iv + 1) * stride + iu;
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    // =========================================================================
    // 8. Conformal Facial Patch, Tapered Curved Eyelashes, Eyebrows & Cat Nose
    // =========================================================================
    function buildConformalFacePatch(centerX, centerY, rx, ry, segsU, segsV, normalLift, headWorldPos) {
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let iv = 0; iv <= segsV; iv++) {
        const v = iv / segsV;
        const ny = (v * 2 - 1);
        for (let iu = 0; iu <= segsU; iu++) {
          const u = iu / segsU;
          const nx = (u * 2 - 1);
          const wx = centerX + nx * rx;
          const wy = centerY + ny * ry;
          const { point, normal } = projectOntoFaceSurface(wx, wy);
          // Slight corneal dome bulge at center for eyes, zero bulge for blush
          const r2 = Math.min(1.0, nx * nx + ny * ny);
          const dome = normalLift.dome * Math.max(0, 1.0 - r2);
          const p = point.addScaledVector(normal, normalLift.base + dome);
          positions.push(p.x - headWorldPos.x, p.y - headWorldPos.y, p.z - headWorldPos.z);
          uvs.push(u, v);
        }
      }

      const stride = segsU + 1;
      for (let iv = 0; iv < segsV; iv++) {
        for (let iu = 0; iu < segsU; iu++) {
          const a = iv * stride + iu;
          const b = a + 1;
          const c = (iv + 1) * stride + iu;
          const d = c + 1;
          indices.push(a, b, c, b, d, c);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function buildTaperedCurveGeometry(points, rStart, rEnd, tubularSegs = 16, radialSegs = 8) {
      const curve = new THREE.CatmullRomCurve3(points);
      const frames = curve.computeFrenetFrames(tubularSegs, false);
      const positions = [];
      const indices = [];

      for (let i = 0; i <= tubularSegs; i++) {
        const u = i / tubularSegs;
        const p = curve.getPointAt(u);
        // Smooth taper with rounded root & pinpoint tip
        const r = (rStart + (rEnd - rStart) * Math.pow(u, 0.85)) * Math.sin(Math.min(1, (1 - u) * 6.0) * Math.PI * 0.5);
        const N = frames.normals[i];
        const B = frames.binormals[i];

        for (let j = 0; j <= radialSegs; j++) {
          const theta = (j / radialSegs) * Math.PI * 2;
          const cx = Math.cos(theta) * r;
          const cy = Math.sin(theta) * r;
          positions.push(
            p.x + N.x * cx + B.x * cy,
            p.y + N.y * cx + B.y * cy,
            p.z + N.z * cx + B.z * cy
          );
        }
      }

      const stride = radialSegs + 1;
      for (let i = 0; i < tubularSegs; i++) {
        for (let j = 0; j < radialSegs; j++) {
          const a = i * stride + j;
          const b = a + 1;
          const c = (i + 1) * stride + j;
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    // Single-Pass GLSL Corneal Eye Material with True Alpha-Cutout Eyelids (Zero white paint-patch bug!)
    function createCornealEyeMaterial() {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: true,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        uniforms: {
          uPupilOffset: { value: new THREE.Vector2(0, 0) },
          uBlink: { value: 0.0 },
          uHappySquint: { value: 0.0 },
          uPupilScale: { value: 1.0 }
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform vec2 uPupilOffset;
          uniform float uBlink;
          uniform float uHappySquint;
          uniform float uPupilScale;
          varying vec2 vUv;

          void main() {
            vec2 p = vUv * 2.0 - 1.0;

            // Oval eye aperture mask
            float eyeDist = length(p / vec2(0.92, 0.96));
            float aa = fwidth(eyeDist) * 1.35;
            float eyeAlpha = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, eyeDist);
            if (eyeAlpha <= 0.002) discard;

            // Soft warm-white sclera + subtle upper-lid orbital shadow
            vec3 scleraCol = vec3(0.985, 0.988, 0.992);
            scleraCol *= mix(1.0, 0.86, smoothstep(0.35, 0.98, p.y));

            // Large expressive turquoise-emerald iris (~88% of eye aperture)
            vec2 irisP = (p - uPupilOffset * 0.24) / vec2(0.80, 0.85);
            float irisR = length(irisP);
            float irisMask = 1.0 - smoothstep(1.0 - aa * 1.4, 1.0 + aa * 1.4, irisR);

            vec3 limbalDark = vec3(0.038, 0.27, 0.30);
            vec3 tealUpper = vec3(0.062, 0.49, 0.50);
            vec3 tealMid = vec3(0.11, 0.69, 0.66);
            vec3 cyanCaustic = vec3(0.30, 0.91, 0.86);

            float vGrad = clamp(irisP.y * 0.5 + 0.5, 0.0, 1.0);
            vec3 irisCol = mix(cyanCaustic, tealMid, smoothstep(0.08, 0.58, vGrad));
            irisCol = mix(irisCol, tealUpper, smoothstep(0.55, 0.95, vGrad));

            // Subtle radial iris fibers
            float ang = atan(irisP.y, irisP.x);
            float fibers = 0.96 + 0.04 * sin(ang * 24.0);
            irisCol *= fibers;

            // Deep limbal ring around iris edge
            irisCol = mix(irisCol, limbalDark, smoothstep(0.74, 0.98, irisR));

            // Deep jewel-teal pupil (luminous & cheerful like reference sheet)
            float pupilR = length(irisP) / (0.45 * uPupilScale);
            float pupilMask = 1.0 - smoothstep(0.95, 1.04, pupilR);
            vec3 pupilCol = vec3(0.032, 0.25, 0.28);
            irisCol = mix(irisCol, pupilCol, pupilMask);

            // Consistent world-space studio catchlights (Top-Left on BOTH eyes -> zero cross-eye!)
            vec2 hl1 = (p - uPupilOffset * 0.10 - vec2(-0.23, 0.28)) / vec2(0.21, 0.22);
            float specMain = 1.0 - smoothstep(0.88, 1.05, length(hl1));

            // Soft translucent secondary glint at lower-right
            vec2 hl2 = (p - uPupilOffset * 0.12 - vec2(0.22, -0.27)) / vec2(0.11, 0.10);
            float specSub = (1.0 - smoothstep(0.75, 1.08, length(hl2))) * 0.46;

            vec3 eyeCol = mix(scleraCol, irisCol, irisMask);
            eyeCol = mix(eyeCol, vec3(1.0), clamp(specMain + specSub * irisMask, 0.0, 1.0));

            // Animated Upper Blink & Happy Crescent Lower-Lid Squint (^ ^)
            float upperCurve = 1.04 - uBlink * 2.08 - 0.14 * (1.0 - p.x * p.x);
            float lowerCurve = -1.06 + uHappySquint * (1.20 - 0.44 * p.x * p.x) + uBlink * 0.18;

            float upperClosed = smoothstep(upperCurve - 0.05, upperCurve + 0.025, p.y);
            float lowerClosed = 1.0 - smoothstep(lowerCurve - 0.03, lowerCurve + 0.045, p.y);
            float lidMask = clamp(max(upperClosed, lowerClosed), 0.0, 1.0);

            // Alpha cutout reveals real lit Soft-Vinyl 3D head mesh directly underneath (zero color mismatch!)
            float openEyeAlpha = eyeAlpha * (1.0 - lidMask);

            // Warm plum-brown eyelid crease stroke along blink & happy crescent curves
            float upperEdgeLine = exp(-pow((p.y - upperCurve) / 0.046, 2.0)) * smoothstep(0.04, 0.22, uBlink);
            float happyEdgeLine = exp(-pow((p.y - lowerCurve) / 0.052, 2.0)) * smoothstep(0.05, 0.25, uHappySquint);
            float creaseAlpha = clamp(upperEdgeLine * 0.78 + happyEdgeLine * 0.88, 0.0, 0.92) * eyeAlpha;

            float finalAlpha = max(openEyeAlpha, creaseAlpha);
            if (finalAlpha <= 0.006) discard;

            vec3 lashCreaseCol = vec3(0.29, 0.16, 0.21);
            float creaseMix = clamp(creaseAlpha / max(0.01, finalAlpha) * (0.45 + 0.55 * lidMask), 0.0, 1.0);
            vec3 finalCol = mix(eyeCol, lashCreaseCol, creaseMix);

            gl_FragColor = vec4(finalCol, finalAlpha);
          }
        `
      });
    }

    // Airbrushed Gaussian Cheek Blush Shader (zero protruding 3D lump!)
    function createAirbrushedBlushMaterial() {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        uniforms: {
          uIntensity: { value: 0.68 },
          uColor: { value: new THREE.Color(0xf678a2) }
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uIntensity;
          uniform vec3 uColor;
          varying vec2 vUv;
          void main() {
            vec2 p = (vUv * 2.0 - 1.0) / vec2(0.95, 0.68);
            float d = length(p);
            float alpha = pow(1.0 - smoothstep(0.08, 1.0, d), 1.65) * uIntensity;
            if (alpha <= 0.003) discard;
            gl_FragColor = vec4(uColor, alpha);
          }
        `
      });
    }

    // Conformal Analytic Cat-Mouth + Philtrum ('ㅅ'/'ω') + Interior Parallax Oral Cavity & Pink Tongue
    function createCatMouthMaterial() {
      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        uniforms: {
          uOpen: { value: 0.22 },
          uWidth: { value: 1.0 },
          uSmile: { value: 0.62 },
          uRoundO: { value: 0.0 },
          uTongueBounce: { value: 0.0 }
        },
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          varying vec3 vViewDir;
          void main() {
            vUv = uv;
            vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
            vViewDir = normalize(-mvPos.xyz);
            gl_Position = projectionMatrix * mvPos;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform float uOpen;
          uniform float uWidth;
          uniform float uSmile;
          uniform float uRoundO;
          uniform float uTongueBounce;
          varying vec2 vUv;
          varying vec3 vViewDir;

          void main() {
            vec2 p = vUv * 2.0 - 1.0; // x in [-1,1], y in [-1,1]
            float aa = max(0.012, fwidth(p.y) * 1.35);

            float halfW = 0.72 * uWidth;
            float xn = p.x / max(0.15, halfW);
            float xClamped = clamp(xn, -1.0, 1.0);

            // Upper 'ω' cat-lip curve: meets philtrum at center, smiles upward at corners
            float catUpper = 0.37 + 0.062 * exp(-xClamped * xClamped * 10.0) + (0.055 + 0.075 * uSmile) * xClamped * xClamped;
            float oUpper = 0.44 - 0.18 * xClamped * xClamped;
            float yTop = mix(catUpper, oUpper, uRoundO);

            // Jaw-hinged lower 'D'-cup curve (hinges smoothly from cute 'ω' smile to wide laugh!)
            float cupProfile = pow(max(0.0, 1.0 - xClamped * xClamped), mix(0.68, 0.52, uRoundO));
            float openDepth = (0.018 + 0.97 * uOpen) * cupProfile;
            float yBot = yTop - openDepth;

            // Vertical cat philtrum line ('ㅅ') descending from pink nose into upper lip peak
            float philCenterTop = mix(0.37 + 0.062, 0.44, uRoundO);
            float inPhilY = smoothstep(philCenterTop - 0.02, philCenterTop + 0.01, p.y) *
                            (1.0 - smoothstep(0.86, 0.91, p.y));
            float philMask = (1.0 - smoothstep(0.022 - aa * 0.5, 0.022 + aa * 0.5, abs(p.x))) * inPhilY;

            // Mouth interior & soft burgundy lip rim mask
            float inX = 1.0 - smoothstep(1.0 - aa * 1.2, 1.0 + aa * 1.2, abs(xn));
            float insideMouth = smoothstep(yBot, yBot + aa * 1.3, p.y) *
                                (1.0 - smoothstep(yTop - aa * 1.3, yTop, p.y)) *
                                (1.0 - smoothstep(0.96, 1.02, abs(xn)));

            // Thin sculpted burgundy lip outline around the mouth perimeter & smile corners
            float distTop = abs(p.y - yTop);
            float distBot = abs(p.y - yBot);
            float rimBand = max(
              1.0 - smoothstep(0.024, 0.024 + aa, distTop),
              1.0 - smoothstep(0.024, 0.024 + aa, distBot)
            ) * inX;

            float totalAlpha = clamp(max(max(insideMouth, rimBand), philMask), 0.0, 1.0);
            if (totalAlpha <= 0.004) discard;

            // Interior parallax offset gives genuine 3D oral cavity & tongue depth in 3/4 views!
            vec2 pIn = p - vec2(vViewDir.x, vViewDir.y) * 0.058;

            // Deep velvet burgundy oral cavity with upper-lip interior depth shadow
            vec3 cavityDeep = vec3(0.16, 0.028, 0.068);
            vec3 cavityMid = vec3(0.30, 0.065, 0.125);
            float cavityGrad = smoothstep(yTop, yBot, pIn.y);
            vec3 interiorCol = mix(cavityDeep, cavityMid, cavityGrad);

            // Bright pastel-pink heart-curved tongue filling lower half of 'D' smile!
            float tongueHalfW = halfW * 0.72;
            float tx = pIn.x / max(0.08, tongueHalfW);
            float centerOpen = 0.018 + 0.97 * uOpen;
            float tonguePeakY = (yTop - centerOpen) + centerOpen * (0.54 + uTongueBounce);
            float heartDimple = 0.032 * exp(-tx * tx * 14.0);
            float yTongue = tonguePeakY - 0.24 * tx * tx - heartDimple;

            float tongueMask = (1.0 - smoothstep(yTongue - aa * 1.2, yTongue + aa * 1.2, pIn.y)) *
                               (1.0 - smoothstep(0.96, 1.06, abs(tx))) *
                               smoothstep(0.11, 0.22, uOpen);

            vec3 tongueBase = vec3(0.89, 0.36, 0.54);
            vec3 tongueHighlight = vec3(0.99, 0.57, 0.73);
            float tGrad = clamp((pIn.y - (yTop - centerOpen)) / max(0.08, centerOpen * 0.55), 0.0, 1.0);
            vec3 tongueCol = mix(tongueBase, tongueHighlight, smoothstep(0.1, 0.9, tGrad));
            tongueCol *= 1.0 - 0.10 * exp(-tx * tx * 22.0) * smoothstep(0.3, 0.9, tGrad);

            interiorCol = mix(interiorCol, tongueCol, tongueMask);

            vec3 lineCol = vec3(0.29, 0.075, 0.135);
            vec3 finalCol = mix(lineCol, interiorCol, clamp(insideMouth * (1.0 - rimBand * 0.55), 0.0, 1.0));

            gl_FragColor = vec4(finalCol, totalAlpha);
          }
        `
      });

    // 2nd-Order Critically/Under-Damped Scalar Spring Helper
    class Spring1D {
      constructor(omega = 16.0, zeta = 0.42) {
        this.omega = omega;
        this.zeta = zeta;
        this.pos = 0;
        this.vel = 0;
        this.target = 0;
      }
      impulse(dv) {
        this.vel += dv;
      }
      step(dt) {
        const force = -this.omega * this.omega * (this.pos - this.target) - 2.0 * this.zeta * this.omega * this.vel;
        this.vel += force * dt;
        this.pos += this.vel * dt;
        return this.pos;
      }
    }

            const [cx, cy, cz, cr] = CLOUD_LOBES[m];
            const sd = Math.abs(sdSphere(vx, vy, vz, cx, cy, cz, cr));
            if (sd < d1) { d2 = d1; d1 = sd; }
            else if (sd < d2) { d2 = sd; }
          }
          const valley = 1.0 - smoothstep(0.0, 0.048, Math.abs(d2 - d1));

          const shade = smoothstep(0.24, 0.54, vy);
          cTmp.copy(underCloud).lerp(topCloud, shade);
          cTmp.lerp(creviceCol, valley * 0.55);
          cols[i * 3] = cTmp.r;
          cols[i * 3 + 1] = cTmp.g;
          cols[i * 3 + 2] = cTmp.b;
        }
        nrm.needsUpdate = true;

      applyCapsuleSkinWeights(tailGeo, [

      ]);

      const tailSkinned = new THREE.SkinnedMesh(tailGeo, whiteSkinMat);

      root.add(tailSkinned);

      // --- E. Seam-Free Parametric Helical Spiral Rainbow Horn ---
      const hornGeo = buildSpiralRainbowHornGeometry();
      const hornMat = createSoftVinylMaterial({
        color: 0xffffff,

        color: 0xf26d9b,

      });

      facialRig.eyeMats = [];
      facialRig.blushMats = [];

      // 1. Conformal Corneal Eyes + Articulated Eyeliner Arch + 4 Tapered Curved Eyelashes

      });

      const mouthPatchGeo = buildConformalFacePatch(
        0, 1.144, 0.148, 0.112, 28, 26,

      const mouthMat = createCatMouthMaterial();
      facialRig.mouthMat = mouthMat;

      return root;

    function step2(edge, val) {
      return val >= edge ? 1.0 : 0.0;
    }

    // =========================================================================
    // 11. Full 25-Bone Discovery & Smooth Spline Game-Animation Synthesizer
    // =========================================================================
    function discoverRigBones(root) {
      Object.keys(rigBones).forEach((k) => { rigBones[k] = null; });

      const candidates = [];
      root.traverse((obj) => {
        if (obj.isBone || obj.type === 'Bone' || obj.userData.isRigNode) {
          candidates.push(obj);
        }
      });

      const pick = (regex, exclude = null) => {
        for (const b of candidates) {
          if (exclude && exclude.test(b.name)) continue;
          if (regex.test(b.name)) return b;
        }
        return null;
      };

      rigBones.hips = pick(/^hips$|pelvis|root_bone|bip001$/i, /end/i);
      rigBones.spine = pick(/^spine$|spine01|spine1/i, /end/i);
      rigBones.chest = pick(/^chest$|upperchest|spine02|spine2/i, /end/i) || rigBones.spine;
      rigBones.neck = pick(/neck/i, /end|nub/i);
      rigBones.head = pick(/^head$|mixamorig.*head|bip.*head/i, /end|top|nub|eye|ear|horn/i);
      rigBones.leftEar = pick(/leftear|ear.*left|ear_l|ear\.l/i, /end/i);
      rigBones.rightEar = pick(/rightear|ear.*right|ear_r|ear\.r/i, /end/i);
      rigBones.horn = pick(/horn/i, /end/i);

      rigBones.leftShoulder = pick(/(left|l_).*(shoulder|clavicle)|(shoulder|clavicle).*(left|_l)/i, /end/i);
      rigBones.rightShoulder = pick(/(right|r_).*(shoulder|clavicle)|(shoulder|clavicle).*(right|_r)/i, /end/i);
      rigBones.leftArm = pick(/^leftarm$|(left|l_).*(upperarm|arm)/i, /fore|lower|hand|shoulder|end/i);
      rigBones.rightArm = pick(/^rightarm$|(right|r_).*(upperarm|arm)/i, /fore|lower|hand|shoulder|end/i);
      rigBones.leftForeArm = pick(/(left|l_).*(forearm|lowerarm)/i, /hand|end/i);
      rigBones.rightForeArm = pick(/(right|r_).*(forearm|lowerarm)/i, /hand|end/i);
      rigBones.leftHand = pick(/(left|l_).*hand/i, /finger|thumb|end/i);
      rigBones.rightHand = pick(/(right|r_).*hand/i, /finger|thumb|end/i);

      rigBones.leftUpLeg = pick(/^leftupleg$|(left|l_).*(upleg|thigh|upperleg)/i, /end/i);
      rigBones.rightUpLeg = pick(/^rightupleg$|(right|r_).*(upleg|thigh|upperleg)/i, /end/i);
      rigBones.leftLeg = pick(/^leftleg$|(left|l_).*(calf|shin|lowerleg)/i, /up|foot|end/i);
      rigBones.rightLeg = pick(/^rightleg$|(right|r_).*(calf|shin|lowerleg)/i, /up|foot|end/i);
      rigBones.leftFoot = pick(/(left|l_).*foot/i, /toe|end/i);
      rigBones.rightFoot = pick(/(right|r_).*foot/i, /toe|end/i);

      rigBones.tailBase = pick(/tailbase|^tail$|tail01|tail1/i, /end/i);
      rigBones.tailMid = pick(/tailmid|tail02|tail2/i, /end/i);
      rigBones.tailTip = pick(/tailtip|tail03|tail3/i, /end/i);
    }

    // High-density SLERP quaternion (with hemisphere sign continuity for 360-deg spins!)
    // & Catmull-Rom spline vector keyframe track builders
    function makeQuatTrack(node, times, eulerSamples) {
      const values = [];
      const baseQuat = node.userData.restQuat || node.quaternion;
      const qDelta = new THREE.Quaternion();
      const euler = new THREE.Euler();
      let prevQ = null;

      for (const [rx, ry, rz] of eulerSamples) {
        euler.set(rx, ry, rz, 'ZYX');
        qDelta.setFromEuler(euler);
        const qFinal = baseQuat.clone().multiply(qDelta);
        if (prevQ && prevQ.dot(qFinal) < 0) {
          qFinal.set(-qFinal.x, -qFinal.y, -qFinal.z, -qFinal.w);
        }
        prevQ = qFinal.clone();
        values.push(qFinal.x, qFinal.y, qFinal.z, qFinal.w);
      }
      return new THREE.QuaternionKeyframeTrack(`${node.uuid}.quaternion`, times, values);
    }

    function makePosTrack(node, times, offsetSamples, smooth = true) {
      const values = [];
      const basePos = node.userData.restPos || node.position;
      for (const [dx, dy, dz] of offsetSamples) {
        values.push(basePos.x + dx, basePos.y + dy, basePos.z + dz);
      }
      const track = new THREE.VectorKeyframeTrack(`${node.uuid}.position`, times, values);
      if (smooth) track.setInterpolation(THREE.InterpolateSmooth);
      return track;
    }

    function makeScaleTrack(node, times, scaleMultipliers, smooth = true) {
      const values = [];
      const baseScale = node.userData.restScale || node.scale;
      for (const [sx, sy, sz] of scaleMultipliers) {
        values.push(baseScale.x * sx, baseScale.y * sy, baseScale.z * sz);
      }
      const track = new THREE.VectorKeyframeTrack(`${node.uuid}.scale`, times, values);
      if (smooth) track.setInterpolation(THREE.InterpolateSmooth);
      return track;
    }

    // Analytical FK Sole Clamp: pins the lower stance foot sole strictly to y = 0.000
    // accounting for pelvic Z-roll (hipRz), pelvic X-pitch (hipPitch), leg tilt & +0.015 toe offset!
    function computeGroundedHipY(
      desiredHipDy,
      lHipRx = 0, lKneeRx = 0, lFootRx = 0, lHipRz = 0,
      rHipRx = 0, rKneeRx = 0, rFootRx = 0, rHipRz = 0,
      hipRz = 0, hipPitch = 0
    ) {
      const p1L = hipPitch + lHipRx;
      const p2L = p1L + lKneeRx;
      const p3L = p2L + lFootRx;
      const legDropL = (
        0.120 * Math.cos(p1L) +
        0.105 * Math.cos(p2L) +
        0.035 * Math.cos(p3L) +
        0.015 * Math.sin(p3L)
      ) * Math.cos(hipRz + lHipRz);

      const p1R = hipPitch + rHipRx;
      const p2R = p1R + rKneeRx;
      const p3R = p2R + rFootRx;
      const legDropR = (
        0.120 * Math.cos(p1R) +
        0.105 * Math.cos(p2R) +
        0.035 * Math.cos(p3R) +
        0.015 * Math.sin(p3R)
      ) * Math.cos(hipRz + rHipRz);

      const socketYL = -0.185 * Math.sin(hipRz) - 0.020 * Math.cos(hipRz) * Math.cos(hipPitch);
      const socketYR = +0.185 * Math.sin(hipRz) - 0.020 * Math.cos(hipRz) * Math.cos(hipPitch);

      const soleL = (0.280 + desiredHipDy) + socketYL - legDropL;
      const soleR = (0.280 + desiredHipDy) + socketYR - legDropR;
      const minSole = Math.min(soleL, soleR);
      return desiredHipDy - minSole;
    }

    // Phase-lagged wave operator & damped elastic overshoot envelope
    function waveLag(ph, lag = 0) {
      const x = ph - lag;
      return 0.90 * Math.sin(x) + 0.10 * Math.sin(2.0 * x - 0.45);
    }

    function dampedOvershoot(s) {
      const c = Math.max(0, Math.min(1, s));
      return 1.0 - Math.exp(-5.4 * c) * Math.cos(6.6 * c);
    }

    // 14 Game-Quality Multi-Joint Skeletal Clips (Verified 'ZYX' Euler Biomechanics + FK Sole Clamp)
    function synthesizeActionClip(actionName) {
      const tracks = [];
      const b = rigBones;

      // -----------------------------------------------------------------------
      // 1. IDLE: Relaxed -37 deg A-stance, contrapposto breathing & figure-8 tail
      // -----------------------------------------------------------------------
      if (actionName === 'Idle') {
        const dur = 3.2;
        const N = 20;
        const times = [];
        const hipPos = [], hipQ = [], spineQ = [], chestQ = [], chestScale = [], headQ = [];
        const lShQ = [], rShQ = [], lArmQ = [], rArmQ = [], lForeQ = [], rForeQ = [];
        const lUpQ = [], rUpQ = [], lKneeQ = [], rKneeQ = [], lFootQ = [], rFootQ = [];
        const tail1Q = [], tail2Q = [], tail3Q = [];

        for (let i = 0; i <= N; i++) {
          const u = i / N;
          const ph = u * Math.PI * 2;
          times.push(u * dur);

          const breath = Math.sin(ph * 2);      // 2 gentle breaths per 3.2s cycle
          const sway = Math.sin(ph);            // 1 contrapposto weight shift per 3.2s cycle
          const hipRoll = sway * 0.022;

          const lKnee = 0.04 + Math.max(0, -sway) * 0.06 + (1 - breath) * 0.02;
          const rKnee = 0.04 + Math.max(0, sway) * 0.06 + (1 - breath) * 0.02;
          const lHipRx = -lKnee * 0.50;
          const rHipRx = -rKnee * 0.50;
          const lFootRx = -lKnee * 0.45;
          const rFootRx = -rKnee * 0.45;
          const hipDy = computeGroundedHipY(0, lHipRx, lKnee, lFootRx, 0, rHipRx, rKnee, rFootRx, 0, hipRoll);

          hipPos.push([sway * 0.016, hipDy, 0]);
          hipQ.push([0, sway * 0.028, hipRoll]);
          spineQ.push([-breath * 0.020, -sway * 0.018, -sway * 0.022]);
          chestQ.push([-breath * 0.016, -sway * 0.016, -sway * 0.014]);
          chestScale.push([1 + breath * 0.015, 1 - breath * 0.008, 1 + breath * 0.018]);
          headQ.push([breath * 0.024, sway * 0.036, -sway * 0.034]);

          // Relaxed natural A-stance (-37 deg below horizontal; zero T-pose stiffness!)
          lShQ.push([0, 0, 0.03 * (1 - breath)]);
          rShQ.push([0, 0, -0.03 * (1 - breath)]);
          lArmQ.push([0, 0.10 + 0.03 * sway, 0.42 - 0.035 * breath]);
          rArmQ.push([0, -0.10 + 0.03 * sway, -0.42 + 0.035 * breath]);
          lForeQ.push([0, 0.20 + 0.04 * breath, 0.06]);
          rForeQ.push([0, -0.20 - 0.04 * breath, -0.06]);

          lUpQ.push([lHipRx, 0, 0]);
          rUpQ.push([rHipRx, 0, 0]);
          lKneeQ.push([lKnee, 0, 0]);
          rKneeQ.push([rKnee, 0, 0]);
          lFootQ.push([lFootRx, 0, 0]);
          rFootQ.push([rFootRx, 0, 0]);

          tail1Q.push([0.05 * breath, 0.18 * waveLag(ph, 0.0), 0]);
          tail2Q.push([0.04 * Math.cos(ph * 2), 0.24 * waveLag(ph, 0.55), 0]);
          tail3Q.push([0.03 * Math.cos(ph * 2 - 0.5), 0.26 * waveLag(ph, 1.05), 0]);
        }

        tracks.push(makePosTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]], false));
        tracks.push(makeQuatTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]]));
        if (b.hips) {
          tracks.push(makePosTrack(b.hips, times, hipPos));
          tracks.push(makeQuatTrack(b.hips, times, hipQ));
        }
        if (b.spine) tracks.push(makeQuatTrack(b.spine, times, spineQ));
        if (b.chest) {
          tracks.push(makeQuatTrack(b.chest, times, chestQ));
          tracks.push(makeScaleTrack(b.chest, times, chestScale));
        }
        if (b.head) tracks.push(makeQuatTrack(b.head, times, headQ));
        if (b.leftShoulder) tracks.push(makeQuatTrack(b.leftShoulder, times, lShQ));
        if (b.rightShoulder) tracks.push(makeQuatTrack(b.rightShoulder, times, rShQ));
        if (b.leftArm) tracks.push(makeQuatTrack(b.leftArm, times, lArmQ));
        if (b.rightArm) tracks.push(makeQuatTrack(b.rightArm, times, rArmQ));
        if (b.leftForeArm) tracks.push(makeQuatTrack(b.leftForeArm, times, lForeQ));
        if (b.rightForeArm) tracks.push(makeQuatTrack(b.rightForeArm, times, rForeQ));
        if (b.leftUpLeg) tracks.push(makeQuatTrack(b.leftUpLeg, times, lUpQ));
        if (b.rightUpLeg) tracks.push(makeQuatTrack(b.rightUpLeg, times, rUpQ));
        if (b.leftLeg) tracks.push(makeQuatTrack(b.leftLeg, times, lKneeQ));
        if (b.rightLeg) tracks.push(makeQuatTrack(b.rightLeg, times, rKneeQ));
        if (b.leftFoot) tracks.push(makeQuatTrack(b.leftFoot, times, lFootQ));
        if (b.rightFoot) tracks.push(makeQuatTrack(b.rightFoot, times, rFootQ));
        if (b.tailBase) tracks.push(makeQuatTrack(b.tailBase, times, tail1Q));
        if (b.tailMid) tracks.push(makeQuatTrack(b.tailMid, times, tail2Q));
        if (b.tailTip) tracks.push(makeQuatTrack(b.tailTip, times, tail3Q));

        return new THREE.AnimationClip('Idle', dur, tracks);
      }

      // -----------------------------------------------------------------------
      // 2. WALK: Cute waddle gait (Contact low -> Passing high, ry arm swing, zero slip!)
      // -----------------------------------------------------------------------
      if (actionName === 'Walk') {
        const dur = 0.64;
        const N = 24;
        const times = [];
        const hipPos = [], hipQ = [], spineQ = [], chestQ = [], headQ = [];
        const lUpQ = [], lKneeQ = [], lFootQ = [];
        const rUpQ = [], rKneeQ = [], rFootQ = [];
        const lArmQ = [], lForeQ = [], rArmQ = [], rForeQ = [];
        const tail1Q = [], tail2Q = [], tail3Q = [];

        for (let i = 0; i <= N; i++) {
          const u = i / N;
          const ph = u * Math.PI * 2;
          times.push(u * dur);

          // Left swings forward (+Z) around ph = 0 -> contact at ph = pi/2 -> mid-stance at ph = pi
          const lSwing = 0.92 * Math.sin(ph) + 0.08 * Math.sin(3.0 * ph);
          const rSwing = -lSwing;
          const lLift = Math.pow(Math.max(0, Math.cos(ph)), 1.20);
          const rLift = Math.pow(Math.max(0, Math.cos(ph + Math.PI)), 1.20);

          const lHipRx = -lSwing * 0.50 - lLift * 0.34;
          const lKneeRx = 0.04 + lLift * 0.92 + Math.max(0, -lSwing) * 0.08;
          const lFootRx = lSwing * 0.20 + lLift * 0.22;

          const rHipRx = -rSwing * 0.50 - rLift * 0.34;
          const rKneeRx = 0.04 + rLift * 0.92 + Math.max(0, -rSwing) * 0.08;
          const rFootRx = rSwing * 0.20 + rLift * 0.22;

          // Hike swing hip slightly upward (-cos(ph) tilts Left socket up when Left swings at ph=0!)
          const waddleRoll = -Math.cos(ph) * 0.042;
          const stanceShiftX = Math.cos(ph) * 0.024;
          const hipDy = computeGroundedHipY(0, lHipRx, lKneeRx, lFootRx, 0, rHipRx, rKneeRx, rFootRx, 0, waddleRoll, 0.04);

          hipPos.push([stanceShiftX, hipDy, 0]);
          hipQ.push([0.04, -lSwing * 0.09, waddleRoll]);
          spineQ.push([0.03, lSwing * 0.06, -waddleRoll * 0.55]);
          chestQ.push([0.02, lSwing * 0.09, -waddleRoll * 0.45]);
          headQ.push([-0.05, -lSwing * 0.05, -waddleRoll * 0.30]);

          lUpQ.push([lHipRx, 0, 0]);
          lKneeQ.push([lKneeRx, 0, 0]);
          lFootQ.push([lFootRx, 0, 0]);

          rUpQ.push([rHipRx, 0, 0]);
          rKneeQ.push([rKneeRx, 0, 0]);
          rFootQ.push([rFootRx, 0, 0]);

          // Contra-lateral fore-aft arm swing strictly around ry (NO rx barrel-roll twist!)
          lArmQ.push([0, rSwing * 0.44, 0.35 - 0.05 * lLift]);
          lForeQ.push([0, 0.22 + Math.max(0, rSwing) * 0.26, 0.06]);
          rArmQ.push([0, -lSwing * 0.44, -0.35 + 0.05 * rLift]);
          rForeQ.push([0, -0.22 - Math.max(0, lSwing) * 0.26, -0.06]);

          tail1Q.push([0.08, -lSwing * 0.24, 0]);
          tail2Q.push([0.06, -waveLag(ph, 0.55) * 0.30, 0]);
          tail3Q.push([0.04, -waveLag(ph, 1.05) * 0.32, 0]);

      // -----------------------------------------------------------------------
      // 3. RUN: Energetic scamper with aerial hop, forward lean & pumped elbows
      // -----------------------------------------------------------------------
      if (actionName === 'Run') {
        const dur = 0.46;
        const N = 24;
        const times = [];
        const pivPos = [], hipPos = [], hipQ = [], spineQ = [], chestQ = [], headQ = [];

        const rUpQ = [], rKneeQ = [], rFootQ = [];

          const ph = u * Math.PI * 2;

          const lSwing = Math.sin(ph);
          const rSwing = -lSwing;
          const lLift = Math.pow(Math.max(0, Math.cos(ph)), 1.15);
          const rLift = Math.pow(Math.max(0, Math.cos(ph + Math.PI)), 1.15);

          // Double-beat aerial hop after each push-off
          const airHop = Math.max(0, Math.sin(ph * 2.0 - 0.35)) * 0.072;

          const lHipRx = -lSwing * 0.66 - lLift * 0.22;
          const lKneeRx = 0.10 + lLift * 0.82 + Math.max(0, -lSwing) * 0.14;
          const lFootRx = lSwing * 0.24 + lLift * 0.24;

          const rHipRx = -rSwing * 0.66 - rLift * 0.22;
          const rKneeRx = 0.10 + rLift * 0.82 + Math.max(0, -rSwing) * 0.14;
          const rFootRx = rSwing * 0.24 + rLift * 0.24;

          const hipDy = computeGroundedHipY(0, lHipRx, lKneeRx, lFootRx, 0, rHipRx, rKneeRx, rFootRx, 0, roll, 0.10);

      // -----------------------------------------------------------------------

      if (actionName === 'Jump') {

      // -----------------------------------------------------------------------
      // 5. WAVE: C-curve line of action + damped overshoot + phase-lagged wave arc
      // -----------------------------------------------------------------------
      if (actionName === 'Wave') {
        const dur = 1.52;
        const N = 28;
        const times = [];
        const hipPos = [], spineQ = [], chestQ = [], headQ = [];
        const rShQ = [], rArmQ = [], rForeQ = [], rHandQ = [], lArmQ = [], lForeQ = [];

        const tail1Q = [], tail2Q = [];

        for (let i = 0; i <= N; i++) {

          const antic = u < 0.13 ? Math.sin((u / 0.13) * Math.PI) : 0;
          const rise = u >= 0.08 ? dampedOvershoot((u - 0.08) / 0.24) : 0;
          const fall = 1.0 - smoothstep(0.80, 0.99, u);
          const env = Math.min(1.12, rise) * fall;

          const wArm = waveLag(wPh, 0.0) * smoothstep(0.14, 0.24, u) * fall;
          const wFore = waveLag(wPh, 0.45) * smoothstep(0.14, 0.24, u) * fall;

          rShQ.push([0, 0, 0.09 * env]);
          rArmQ.push([0, -0.14 * env, -0.42 * (1.0 - Math.min(1, env)) + 0.56 * env - 0.14 * antic + 0.10 * wArm]);
          rForeQ.push([0, -0.20 * (1.0 - Math.min(1, env)) - 0.10 * env, 0.12 * env + 0.22 * wFore]);

          rUpQ.push([hipRx, 0, 0]);

          rKneeQ.push([knee, 0, 0]);
          lFootQ.push([footRx, 0, 0]);
          rFootQ.push([footRx, 0, 0]);

          tail1Q.push([0.08 * env, 0.28 * wArm, 0]);
          tail2Q.push([0.06 * env, 0.36 * wFore, 0]);
        }

        tracks.push(makePosTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]], false));
        tracks.push(makeQuatTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]]));
        if (b.hips) {

        if (b.chest) tracks.push(makeQuatTrack(b.chest, times, chestQ));

        if (b.leftArm) tracks.push(makeQuatTrack(b.leftArm, times, lArmQ));
        if (b.leftForeArm) tracks.push(makeQuatTrack(b.leftForeArm, times, lForeQ));
        if (b.leftUpLeg) tracks.push(makeQuatTrack(b.leftUpLeg, times, lUpQ));
        if (b.rightUpLeg) tracks.push(makeQuatTrack(b.rightUpLeg, times, rUpQ));
        if (b.leftLeg) tracks.push(makeQuatTrack(b.leftLeg, times, lKneeQ));
        if (b.rightLeg) tracks.push(makeQuatTrack(b.rightLeg, times, rKneeQ));
        if (b.leftFoot) tracks.push(makeQuatTrack(b.leftFoot, times, lFootQ));
        if (b.rightFoot) tracks.push(makeQuatTrack(b.rightFoot, times, rFootQ));

        if (b.tailMid) tracks.push(makeQuatTrack(b.tailMid, times, tail2Q));

        return new THREE.AnimationClip('Wave', dur, tracks);

      // -----------------------------------------------------------------------
      // 6. TALK: Natural lowered shoulders + forward-elbow conversational gestures

      if (actionName === 'Talk') {

      // -----------------------------------------------------------------------
      // 7. HAPPYSPIN: Wind-up -> Joyful 360-deg airborne pirouette -> Cushioned settle
      // -----------------------------------------------------------------------
      if (actionName === 'HappySpin') {
        const dur = 1.08;
        const N = 32;
        const times = [];
        const pivPos = [], pivQ = [], hipPos = [], spineQ = [], headQ = [];
        const lArmQ = [], rArmQ = [], lForeQ = [], rForeQ = [];
        const lUpQ = [], rUpQ = [], lKneeQ = [], rKneeQ = [], lFootQ = [], rFootQ = [];
        const tail1Q = [];

        for (let i = 0; i <= N; i++) {
          const u = i / N;
          times.push(u * dur);

          let airY = 0;
          let crouch = 0;
          let spinYaw = 0;
          let star = 0;

          if (u < 0.16) {

          const restBlend = 1.0 - star;

          const footRx = -crouch * 0.24 + star * 0.34;

            : computeGroundedHipY(0, hipRx, kneeRx, footRx, 0, hipRx, kneeRx, footRx, 0);

          lForeQ.push([0, 0.20 * restBlend, -star * 0.10]);
          rForeQ.push([0, -0.20 * restBlend, star * 0.10]);

          rUpQ.push([hipRx, 0, star * 0.12]);

          rKneeQ.push([kneeRx, 0, 0]);

          const u = i / N;
          const ph = u * Math.PI * 2;

          hipPos.push([0, hipDy, 0]);
          spineQ.push([0.12 + sniffle * 0.05, 0, Math.sin(ph) * 0.03]);

          rEarQ.push([-0.16, 0, -0.28]);

          lArmQ.push([0, 0.22, 0.46]);
          rArmQ.push([0, -0.22, -0.46]);
          lForeQ.push([0, 0.30, 0.08]);
          rForeQ.push([0, -0.30, -0.08]);

          rUpQ.push([hipRx, 0, 0]);
          lKneeQ.push([knee, 0, 0]);
          rKneeQ.push([knee, 0, 0]);
          lFootQ.push([footRx, 0, 0]);

        tracks.push(makePosTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]], false));
        tracks.push(makeQuatTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]]));
        if (b.hips) {
          tracks.push(makePosTrack(b.hips, times, hipPos));
          tracks.push(makeQuatTrack(b.hips, [0, dur], [[0, 0, 0], [0, 0, 0]]));
        }
        if (b.spine) tracks.push(makeQuatTrack(b.spine, times, spineQ));
        if (b.head) tracks.push(makeQuatTrack(b.head, times, headQ));
        if (b.leftEar) tracks.push(makeQuatTrack(b.leftEar, times, lEarQ));
        if (b.rightEar) tracks.push(makeQuatTrack(b.rightEar, times, rEarQ));

      // -----------------------------------------------------------------------
      // 20. PROUD: Confident chest puff, triumphant nod & hero stance

      if (actionName === 'Proud') {
        const dur = 1.8;
        const N = 20;
        const times = [];

          const nod = Math.sin(ph * 2);

          const hipRx = -knee * 0.5;
          const footRx = -knee * 0.45;
          const hipDy = computeGroundedHipY(0, hipRx, knee, footRx, 0, hipRx, knee, footRx, 0);

          hipPos.push([0, hipDy, 0.015 * puff]);
          spineQ.push([-0.09 - 0.04 * puff, 0, 0]);
          chestScale.push([1 + 0.045 * puff, 1 + 0.035 * puff, 1 + 0.055 * puff]);
          headQ.push([-0.10 + 0.08 * nod, 0.06 * Math.sin(ph), 0]);

          lArmQ.push([0, 0.14, 0.26]);
          rArmQ.push([0, -0.14, -0.26]);
          lForeQ.push([0, 0.46, 0.16]);

        tracks.push(makeQuatTrack(characterPivot, [0, dur], [[0, 0, 0], [0, 0, 0]]));
        if (b.hips) {
          tracks.push(makePosTrack(b.hips, times, hipPos));
          tracks.push(makeQuatTrack(b.hips, [0, dur], [[0, 0, 0], [0, 0, 0]]));
        }
        if (b.spine) tracks.push(makeQuatTrack(b.spine, times, spineQ));
        if (b.chest) tracks.push(makeScaleTrack(b.chest, times, chestScale));
        if (b.head) tracks.push(makeQuatTrack(b.head, times, headQ));
        if (b.leftArm) tracks.push(makeQuatTrack(b.leftArm, times, lArmQ));

        if (b.leftForeArm) tracks.push(makeQuatTrack(b.leftForeArm, times, lForeQ));
        if (b.rightForeArm) tracks.push(makeQuatTrack(b.rightForeArm, times, rForeQ));
        if (b.leftUpLeg) tracks.push(makeQuatTrack(b.leftUpLeg, times, lUpQ));

      // -----------------------------------------------------------------------
      // 21. SNACK: Happy rainbow-treat munching bounce with chewing rhythm

      const dur = 1.6;

      const times = [];
      const hipPos = [], spineQ = [], chestScale = [], headQ = [];

        const footRx = -knee * 0.45;
        const hipDy = computeGroundedHipY(0, hipRx, knee, footRx, 0, hipRx, knee, footRx, 0);

        hipPos.push([sway * 0.018, hipDy, 0]);
        spineQ.push([0.04 * munch, 0, sway * 0.04]);
        chestScale.push([1 + 0.03 * munch, 1 - 0.02 * munch, 1 + 0.03 * munch]);
        headQ.push([0.08 * munch - 0.02, sway * 0.05, sway * 0.08]);

        // Both paws held cutely in front of chest as if holding a treat (safe clearance from head!)
        lArmQ.push([0, 0.38, 0.28 - 0.06 * munch]);
        rArmQ.push([0, -0.38, -0.28 + 0.06 * munch]);
        lForeQ.push([0, 0.52, 0.14 + 0.06 * munch]);
        rForeQ.push([0, -0.52, -0.14 - 0.06 * munch]);
